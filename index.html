<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#08dada">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="KG Amount">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon"
      href="icon-192.png">

<title>T-Post</title>


<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  background:#f4f7f8;
  color:#172024;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.app{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:8px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:8px;
}

h1{
  font-size:21px;
  margin:0;
}

.save{
  font-size:12px;
  color:#667;
}


/* =========================
   CARD
========================= */

.card{
  width:100%;
  max-width:100%;

  background:#fff;

  border-radius:14px;

  box-shadow:0 2px 10px #0001;

  overflow:hidden;
}


/* =========================
   MAIN TABLE
========================= */

.scroll{
  width:100%;
  max-width:100%;

  overflow:hidden;
}

.main-table{

  width:100%;
  max-width:100%;

  min-width:0;

  table-layout:fixed;

  border-collapse:collapse;

}


/* =========================
   COLUMN WIDTHS
========================= */

/*
Name       = 25%
Qty        = 12%
kg/bag     = 9%
Kilo       = 15%
Price      = 12%
Total      = 27%

TOTAL = 100%
*/


.main-table col:nth-child(1){
  width:25%;
}

.main-table col:nth-child(2){
  width:12%;
}

.main-table col:nth-child(3){
  width:9%;
}

.main-table col:nth-child(4){
  width:15%;
}

.main-table col:nth-child(5){
  width:12%;
}

.main-table col:nth-child(6){
  width:27%;
}


/* =========================
   HEADER
========================= */

.main-table th{

  background:#08dada;

  height:55px;

  padding:6px 2px;

  text-align:center;

  font-size:14px;

  font-weight:700;

  line-height:1.1;

  white-space:normal;

  overflow:hidden;

  word-break:break-word;

}


/* =========================
   CELLS
========================= */

.main-table td{

  height:43px;

  padding:1px 2px;

  border:1px solid #d9dfe2;

  overflow:hidden;

}


/* =========================
   INPUTS
========================= */

.main-table input{

  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  height:39px;

  border:0;

  outline:0;

  background:transparent;

  padding:3px 2px;

  font-size:15px;

}


/* NUMBER INPUTS */

.main-table input.num{

  text-align:center;

}


/* =========================
   CALCULATED CELLS
========================= */

.calc{

  text-align:center;

  padding:3px 2px;

  font-size:14px;

  font-variant-numeric:
    tabular-nums;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:clip;

  background:#f8fafb;

}


/* =========================
   SUMMARY
========================= */

.summary{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  padding:8px;

}

.box{

  background:#08dada;

  border-radius:8px;

  padding:8px 10px;

}

.box span{

  font-size:13px;

}

.box strong{

  display:block;

  text-align:right;

  font-size:18px;

  margin-top:3px;

}


/* =========================
   AMOUNT SECTION
========================= */

.amount{

  width:100%;
  max-width:100%;

  padding:0 8px 8px;

  overflow:hidden;

}

.amount table{

  width:100%;
  max-width:100%;

  min-width:0;

  table-layout:fixed;

  border-collapse:collapse;

}

.amount th{

  background:#08dada;

  padding:8px 4px;

  text-align:left;

}

.amount th:last-child{

  text-align:right;

}

.amount td{

  height:40px;

  border:1px solid #d9dfe2;

  padding:2px 4px;

}

.amount .deduct{

  width:100%;
  max-width:100%;

  text-align:right;

  border:0;

  outline:0;

  background:transparent;

  font-size:16px;

}

.amountTotal{

  font-weight:700;

}


/* =========================
   BUTTONS
========================= */

.actions{

  display:flex;

  gap:8px;

  padding:8px;

}

button{

  border:0;

  border-radius:10px;

  padding:10px 12px;

  font-size:14px;

  font-weight:700;

}

.add{

  background:#08dada;

}

.clear{

  background:#e7eeee;

}


/* =========================
   IPHONE
========================= */

@media(max-width:600px){

  .app{

    width:100%;

    padding:4px;

  }


  .top{

    margin-bottom:6px;

  }


  h1{

    font-size:18px;

  }


  .save{

    display:none;

  }


  /* MAIN TABLE */

  .scroll{

    width:100%;

    max-width:100%;

    overflow:hidden;

  }


  .main-table{

    width:100%;

    min-width:0;

    max-width:100%;

    table-layout:fixed;

  }


  /* HEADER */

  .main-table th{

    height:55px;

    font-size:11px;

    padding:5px 1px;

    line-height:1.05;

    white-space:normal;

    word-break:break-word;

  }


  /* CELLS */

  .main-table td{

    height:43px;

    padding:1px;

  }


  /* INPUTS */

  .main-table input{

    width:100%;

    max-width:100%;

    min-width:0;

    height:39px;

    padding:3px 1px;

    font-size:14px;

  }


  .main-table input.num{

    text-align:center;

  }


  /* CALCULATED */

  .main-table .calc{

    width:100%;

    padding:3px 1px;

    font-size:13px;

    text-align:center;

    white-space:nowrap;

    overflow:hidden;

  }


  /* SUMMARY */

  .summary{

    grid-template-columns:
      1fr 1fr;

    gap:6px;

    padding:6px;

  }


  .box{

    padding:7px 8px;

  }


  .box span{

    font-size:12px;

  }


  .box strong{

    font-size:16px;

  }


  /* AMOUNT */

  .amount{

    padding:0 6px 6px;

  }


  /* BUTTONS */

  .actions{

    padding:6px;

  }


  button{

    padding:10px;

    font-size:13px;

  }

}


/* =========================
   VERY SMALL IPHONE
========================= */

@media(max-width:390px){

  .main-table th{

    font-size:10px;

  }

  .main-table input{

    font-size:13px;

  }

  .main-table .calc{

    font-size:12px;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- TITLE -->

  <div class="top">

    <h1>
      KG & Amount Calculator
    </h1>

    <span
      class="save"
      id="saveState">
      Saved
    </span>

  </div>


  <div class="card">


    <!-- =========================
         MAIN TABLE
    ========================== -->

    <div class="scroll">

      <table class="main-table">


        <!-- FIXED 6 COLUMN WIDTHS -->

        <colgroup>

          <col style="width:25%">

          <col style="width:12%">

          <col style="width:9%">

          <col style="width:15%">

          <col style="width:12%">

          <col style="width:27%">

        </colgroup>


        <thead>

          <tr>

            <th>
              Name
            </th>

            <th>
              Qty
            </th>

            <th>
              kg/bag
            </th>

            <th>
              Kilo
            </th>

            <th>
              Price
            </th>

            <th>
              Total Amount
            </th>

          </tr>

        </thead>


        <tbody id="rows"></tbody>


      </table>

    </div>


    <!-- =========================
         SUMMARY
    ========================== -->

    <div class="summary">


      <div class="box">

        <span>
          Σ kilo
        </span>

        <strong id="sumKilo">
          0
        </strong>

      </div>


      <div class="box">

        <span>
          Σ Total Amount
        </span>

        <strong id="sumAmount">
          0
        </strong>

      </div>


    </div>


    <!-- =========================
         AMOUNT / DEDUCTIONS
    ========================== -->

    <div class="amount">


      <table>


        <thead>

          <tr>

            <th>
              Amount
            </th>

            <th>
              Amount
            </th>

          </tr>

        </thead>


        <tbody id="deductions"></tbody>


        <tfoot>

          <tr>

            <td class="amountTotal">
              Amount total
            </td>

            <td
              class="calc amountTotal"
              id="amountTotal">
              0
            </td>

          </tr>

        </tfoot>


      </table>

    </div>


    <!-- =========================
         BUTTONS
    ========================== -->

    <div class="actions">


      <button
        class="add"
        id="add">

        ＋ Add row

      </button>


      <button
        class="clear"
        id="clear">

        Clear all

      </button>


    </div>


  </div>


</div>


<script>


/* =========================
   ELEMENTS
========================= */

const rowsEl =
  document.querySelector('#rows');

const dedEl =
  document.querySelector('#deductions');

const KEY =
  'kgAmountPWA';


/* =========================
   BLANK ROW
========================= */

const blank = () => ({

  name:'',
  qty:'',
  kgBag:'',
  price:''

});


/* =========================
   NUMBER
========================= */

function num(v){

  return Number.parseFloat(v) || 0;

}


/* =========================
   FORMAT NUMBER
========================= */

function fmt(v){

  return Number.isInteger(v)

    ? String(v)

    : v.toFixed(2)
       .replace(/\.?0+$/,'');

}


/* =========================
   CREATE INPUT
========================= */

function input(
  cls,
  val,
  type='text',
  ph=''
){

  let e =
    document.createElement('input');

  e.className = cls;

  e.value = val || '';

  e.type = type;

  e.placeholder = ph;


  if(type === 'number'){

    e.step = 'any';

  }


  return e;

}


/* =========================
   ADD MAIN ROW
========================= */

function addRow(d=blank()){


  let tr =
    document.createElement('tr');


  /* NAME */

  let name =
    input(
      '',
      d.name
    );


  /* QTY */

  let qty =
    input(
      'num',
      d.qty,
      'number'
    );


  /* KG/BAG */

  let kg =
    input(
      'num',
      d.kgBag,
      'number'
    );


  /* PRICE */

  let price =
    input(
      'num',
      d.price,
      'number'
    );


  /* KILO */

  let kilo =
    document.createElement('td');

  kilo.className =
    'calc kilo';


  /* TOTAL AMOUNT */

  let total =
    document.createElement('td');

  total.className =
    'calc total';


  let cells = [

    name,
    qty,
    kg,
    kilo,
    price,
    total

  ];


  cells.forEach((x,i)=>{


    let td;


    /*
      Kilo and Total Amount
      are already TD elements.
    */

    if(
      i === 3 ||
      i === 5
    ){

      td = x;

    }

    else{

      td =
        document.createElement('td');

      td.appendChild(x);

    }


    tr.appendChild(td);

  });


  /* CALCULATE WHEN TYPING */

  [
    name,
    qty,
    kg,
    price

  ].forEach(x=>{

    x.addEventListener(
      'input',
      calculate
    );

  });


  rowsEl.appendChild(tr);

}


/* =========================
   ADD DEDUCTION
========================= */

function addDeduction(v=''){

  let tr =
    document.createElement('tr');


  let a =
    document.createElement('td');


  let b =
    document.createElement('td');


  let x =
    input(
      'deduct',
      v,
      'number'
    );


  b.appendChild(x);


  tr.appendChild(a);

  tr.appendChild(b);


  x.addEventListener(
    'input',
    calculate
  );


  dedEl.appendChild(tr);

}


/* =========================
   CALCULATE
========================= */

function calculate(){

  let sk = 0;

  let sa = 0;


  [
    ...rowsEl.rows

  ].forEach(r=>{


    let q =
      num(
        r.cells[1]
         .firstChild.value
      );


    let kg =
      num(
        r.cells[2]
         .firstChild.value
      );


    let p =
      num(
        r.cells[4]
         .firstChild.value
      );


    /* KILO */

    let k =
      q * kg;


    /* TOTAL AMOUNT */

    let t =
      k * p;


    r.querySelector(
      '.kilo'
    ).textContent =
      fmt(k);


    r.querySelector(
      '.total'
    ).textContent =
      fmt(t);


    sk += k;

    sa += t;

  });


  /* =========================
     DEDUCTIONS
  ========================== */

  let d = 0;


  document
    .querySelectorAll('.deduct')
    .forEach(x=>{

      d += num(x.value);

    });


  /* =========================
     SUMMARY
  ========================== */

  document.querySelector(
    '#sumKilo'
  ).textContent =
    fmt(sk);


  document.querySelector(
    '#sumAmount'
  ).textContent =
    fmt(sa);


  document.querySelector(
    '#amountTotal'
  ).textContent =
    fmt(sa - d);


  /* SAVE */

  save();


  document.querySelector(
    '#saveState'
  ).textContent =
    'Saved';

}


/* =========================
   SAVE DATA
========================= */

function save(){

  let data = {


    rows:
      [
        ...rowsEl.rows

      ].map(r=>({


        name:
          r.cells[0]
           .firstChild.value,


        qty:
          r.cells[1]
           .firstChild.value,


        kgBag:
          r.cells[2]
           .firstChild.value,


        price:
          r.cells[4]
           .firstChild.value


      })),


    ded:
      [
        ...document
          .querySelectorAll('.deduct')

      ].map(x=>x.value)


  };


  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


/* =========================
   LOAD
========================= */

function load(){


  try{


    let d =
      JSON.parse(
        localStorage.getItem(KEY)
      );


    if(d){


      /*
        If saved data exists,
        load it.
      */

      (d.rows || [])
        .forEach(addRow);


      (d.ded || [])
        .forEach(addDeduction);


      return;

    }


  }

  catch(e){}


  /*
    FIRST TIME:
    SHOW ONLY 10 ROWS
  */

  for(
    let i = 0;
    i < 10;
    i++
  ){

    addRow();

  }


  /*
    DEDUCTION ROWS
  */

  for(
    let i = 0;
    i < 13;
    i++
  ){

    addDeduction();

  }

}


/* =========================
   ADD ROW BUTTON
========================= */

document.querySelector(
  '#add'
).onclick = function(){


  addRow();


  calculate();


};


/* =========================
   CLEAR ALL
========================= */

document.querySelector(
  '#clear'
).onclick = function(){


  if(
    confirm(
      'Clear all entries?'
    )
  ){


    rowsEl.innerHTML = '';

    dedEl.innerHTML = '';


    /*
      RESET TO 10 ROWS
    */

    for(
      let i = 0;
      i < 10;
      i++
    ){

      addRow();

    }


    /*
      RESET DEDUCTIONS
    */

    for(
      let i = 0;
      i < 13;
      i++
    ){

      addDeduction();

    }


    calculate();

  }

};


/* =========================
   START
========================= */

load();

calculate();


/* =========================
   SERVICE WORKER
========================= */

if(
  'serviceWorker' in navigator
){

  window.addEventListener(
    'load',
    function(){

      navigator.serviceWorker.register(
        'sw.js'
      );

    }
  );

}

</script>

</body>
</html>
