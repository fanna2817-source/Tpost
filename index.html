<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#08dada">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KG Amount">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>T-Post</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7f8;
  color:#172024;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  max-width:1000px;
  margin:auto;
  padding:12px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

h1{
  font-size:21px;
  margin:0;
}

.save{
  font-size:12px;
  color:#667;
  opacity:.9;
}

.card{
  background:#fff;
  border-radius:14px;
  box-shadow:0 2px 10px #0001;
  overflow:hidden;
}

.scroll{
  overflow-x:hidden;
}

/* MAIN TABLE */
table{
  border-collapse:collapse;
  width:100%;
  min-width:0;
  table-layout:fixed;
}

th{
  background:#08dada;
  padding:10px 4px;
  text-align:center;
  font-size:14px;
  overflow-wrap:anywhere;
}

td{
  border:1px solid #d9dfe2;
  height:43px;
  padding:2px 4px;
  overflow:hidden;
}

input{
  width:100%;
  height:37px;
  border:0;
  outline:0;
  background:transparent;
  padding:6px;
  font-size:16px;
  min-width:0;
}

input.num{
  text-align:right;
}

.calc{
  text-align:right;
  padding:7px 4px;
  font-variant-numeric:tabular-nums;
  background:#f8fafb;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* SUMMARY */
.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:12px;
}

.box{
  background:#08dada;
  border-radius:8px;
  padding:9px 12px;
}

.box span{
  font-size:13px;
}

.box strong{
  display:block;
  text-align:right;
  font-size:18px;
  margin-top:3px;
}

/* DEDUCTIONS */
.amount{
  padding:0 12px 12px;
}

.amount table{
  min-width:0;
  width:100%;
  table-layout:auto;
}

.amount th{
  text-align:left;
}

.amount th:last-child{
  text-align:right;
}

.amount td{
  height:40px;
}

.amount .deduct{
  text-align:right;
}

.amountTotal{
  font-weight:700;
}

/* BUTTONS */
.actions{
  display:flex;
  gap:8px;
  padding:12px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-size:15px;
  font-weight:700;
}

.add{
  background:#08dada;
}

.clear{
  background:#e7eeee;
}

/* IPHONE / SMALL SCREEN */
@media(max-width:600px){

  .app{
    padding:4px;
  }

  .top{
    margin-bottom:6px;
  }

  h1{
    font-size:18px;
  }

  .save{
    display:none;
  }

  .scroll{
    overflow-x:hidden;
    width:100%;
  }

  /* Force all 6 columns to stay inside the screen */
  table{
    width:100%;
    min-width:0;
    table-layout:fixed;
  }

  th{
    font-size:10px;
    line-height:1.1;
    padding:7px 2px;
    white-space:normal;
    overflow-wrap:anywhere;
  }

  td{
    height:43px;
    padding:1px 2px;
  }

  input{
    width:100%;
    height:38px;
    padding:4px 2px;
    font-size:13px;
    min-width:0;
  }

  input.num{
    text-align:center;
  }

  .calc{
    padding:4px 2px;
    font-size:12px;
    text-align:center;
  }

  /* Column proportions */
  th:nth-child(1),
  td:nth-child(1){
    width:20%;
  }

  th:nth-child(2),
  td:nth-child(2){
    width:12%;
  }

  th:nth-child(3),
  td:nth-child(3){
    width:9%;
  }

  th:nth-child(4),
  td:nth-child(4){
    width:14%;
  }

  th:nth-child(5),
  td:nth-child(5){
    width:15%;
  }

  th:nth-child(6),
  td:nth-child(6){
    width:25%;
  }

  .summary{
    grid-template-columns:1fr;
    gap:6px;
    padding:8px;
  }

  .box{
    padding:8px 10px;
  }

  .actions{
    padding:8px;
  }

  button{
    padding:10px 12px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <h1>KG & Amount Calculator</h1>
    <span class="save" id="saveState">Saved</span>
  </div>

  <div class="card">

    <!-- MAIN TABLE -->
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Qty</th>
            <th>kg/bag</th>
            <th>Kilo</th>
            <th>Price</th>
            <th>Total Amount</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>
      </table>
    </div>

    <!-- SUMMARY -->
    <div class="summary">

      <div class="box">
        <span>Σ kilo</span>
        <strong id="sumKilo">0</strong>
      </div>

      <div class="box">
        <span>Σ Total Amount</span>
        <strong id="sumAmount">0</strong>
      </div>

    </div>

    <!-- AMOUNT / DEDUCTIONS -->
    <div class="amount">

      <table>

        <thead>
          <tr>
            <th>Amount</th>
            <th>Amount</th>
          </tr>
        </thead>

        <tbody id="deductions"></tbody>

        <tfoot>
          <tr>
            <td class="amountTotal">Amount total</td>
            <td class="calc amountTotal" id="amountTotal">0</td>
          </tr>
        </tfoot>

      </table>

    </div>

    <!-- BUTTONS -->
    <div class="actions">
      <button class="add" id="add">＋ Add row</button>
      <button class="clear" id="clear">Clear all</button>
    </div>

  </div>

</div>

<script>

const rowsEl=document.querySelector('#rows');
const dedEl=document.querySelector('#deductions');

const KEY='kgAmountPWA';

const blank=()=>({
  name:'',
  qty:'',
  kgBag:'',
  price:''
});

function num(v){
  return Number.parseFloat(v)||0;
}

function fmt(v){
  return Number.isInteger(v)
    ? String(v)
    : v.toFixed(2).replace(/\.?0+$/,'');
}

function input(cls,val,type='text',ph=''){

  let e=document.createElement('input');

  e.className=cls;
  e.value=val||'';
  e.type=type;
  e.placeholder=ph;

  if(type==='number'){
    e.step='any';
  }

  return e;
}

/* ADD MAIN ROW */
function addRow(d=blank()){

  let tr=document.createElement('tr');

  let name=input('',d.name);

  let qty=input(
    'num',
    d.qty,
    'number'
  );

  let kg=input(
    'num',
    d.kgBag,
    'number'
  );

  let price=input(
    'num',
    d.price,
    'number'
  );

  let kilo=document.createElement('td');
  kilo.className='calc kilo';

  let total=document.createElement('td');
  total.className='calc total';

  let cells=[
    name,
    qty,
    kg,
    kilo,
    price,
    total
  ];

  cells.forEach((x,i)=>{

    let td;

    if(i===3 || i===5){

      td=x;

    }else{

      td=document.createElement('td');
      td.appendChild(x);

    }

    tr.appendChild(td);

  });

  [name,qty,kg,price].forEach(x=>{
    x.addEventListener('input',calculate);
  });

  rowsEl.appendChild(tr);
}

/* ADD DEDUCTION */
function addDeduction(v=''){

  let tr=document.createElement('tr');

  let a=document.createElement('td');
  let b=document.createElement('td');

  let x=input(
    'deduct',
    v,
    'number'
  );

  b.appendChild(x);

  tr.append(a,b);

  x.addEventListener('input',calculate);

  dedEl.appendChild(tr);
}

/* CALCULATE */
function calculate(){

  let sk=0;
  let sa=0;

  [...rowsEl.rows].forEach(r=>{

    let q=num(
      r.cells[1].firstChild.value
    );

    let kg=num(
      r.cells[2].firstChild.value
    );

    let p=num(
      r.cells[4].firstChild.value
    );

    let k=q*kg;
    let t=k*p;

    r.querySelector('.kilo').textContent=fmt(k);

    r.querySelector('.total').textContent=fmt(t);

    sk+=k;
    sa+=t;

  });

  let d=0;

  document
    .querySelectorAll('.deduct')
    .forEach(x=>{
      d+=num(x.value);
    });

  document.querySelector('#sumKilo').textContent=fmt(sk);

  document.querySelector('#sumAmount').textContent=fmt(sa);

  document.querySelector('#amountTotal').textContent=fmt(sa-d);

  save();

  document.querySelector('#saveState').textContent='Saved';
}

/* SAVE */
function save(){

  let data={

    rows:[...rowsEl.rows].map(r=>({

      name:r.cells[0].firstChild.value,

      qty:r.cells[1].firstChild.value,

      kgBag:r.cells[2].firstChild.value,

      price:r.cells[4].firstChild.value

    })),

    ded:[
      ...document.querySelectorAll('.deduct')
    ].map(x=>x.value)

  };

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );
}

/* LOAD */
function load(){

  try{

    let d=JSON.parse(
      localStorage.getItem(KEY)
    );

    if(d){

      (d.rows||[]).forEach(addRow);

      (d.ded||[]).forEach(addDeduction);

      return;
    }

  }catch(e){}

  /* DEFAULT ROWS */
  for(let i=0;i<15;i++){
    addRow();
  }

  /* DEFAULT DEDUCTIONS */
  for(let i=0;i<13;i++){
    addDeduction();
  }
}

/* ADD ROW BUTTON */
document.querySelector('#add').onclick=()=>{

  addRow();

  calculate();

};

/* CLEAR BUTTON */
document.querySelector('#clear').onclick=()=>{

  if(
    confirm('Clear all entries?')
  ){

    rowsEl.innerHTML='';

    dedEl.innerHTML='';

    for(let i=0;i<15;i++){
      addRow();
    }

    for(let i=0;i<13;i++){
      addDeduction();
    }

    calculate();

  }

};

/* START */
load();

calculate();

/* SERVICE WORKER */
if('serviceWorker' in navigator){

  window.addEventListener(
    'load',
    ()=>{
      navigator.serviceWorker.register('sw.js');
    }
  );

}

</script>

</body>
</html>
