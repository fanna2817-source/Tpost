<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#08dada">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="T-Post">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>T-Post</title>

<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  background:#f4f7f8;
  color:#172024;
  font-family:-apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Arial,
              sans-serif;
}

.app{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:4px;
}


/* =========================
   TOP
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:20px;
  line-height:1.2;
}

.save{
  font-size:11px;
  color:#667;
}


/* =========================
   CLIENT TABS
========================= */

.clientBar{
  display:flex;
  align-items:flex-end;
  gap:4px;

  width:100%;
  max-width:100%;

  overflow-x:auto;
  overflow-y:hidden;

  padding:2px 0 5px;

  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.clientBar::-webkit-scrollbar{
  display:none;
}

.clientTab{
  flex:0 0 auto;

  border:0;
  border-radius:9px 9px 0 0;

  padding:8px 12px;

  background:#dfe8e9;
  color:#172024;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
}

.clientTab.active{
  background:#08dada;
}

.newClient{
  flex:0 0 auto;

  border:0;
  border-radius:9px;

  padding:8px 11px;

  background:#172024;
  color:#fff;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
}


/* =========================
   CARD
========================= */

.card{
  width:100%;
  max-width:100%;

  background:#fff;

  border-radius:0 14px 14px 14px;

  box-shadow:0 2px 10px #0001;

  overflow:hidden;
}


/* =========================
   TABLE WRAPPER
========================= */

.scroll{
  width:100%;
  max-width:100%;

  overflow:hidden;
}


/* =========================
   MAIN TABLE

   IMPORTANT:
   TOTAL WIDTH = 100%

   Name          25%
   Qty           12%
   kg/bag         9%
   Kilo          15%
   Price         12%
   Total Amount  27%
========================= */

.mainTable{
  width:100%;
  max-width:100%;
  min-width:0;

  border-collapse:collapse;

  table-layout:fixed;
}


/* COLUMN 1 - NAME */

.mainTable th:nth-child(1),
.mainTable td:nth-child(1){
  width:25%;
}


/* COLUMN 2 - QTY */

.mainTable th:nth-child(2),
.mainTable td:nth-child(2){
  width:12%;
}


/* COLUMN 3 - KG/BAG */

.mainTable th:nth-child(3),
.mainTable td:nth-child(3){
  width:9%;
}


/* COLUMN 4 - KILO */

.mainTable th:nth-child(4),
.mainTable td:nth-child(4){
  width:15%;
}


/* COLUMN 5 - PRICE */

.mainTable th:nth-child(5),
.mainTable td:nth-child(5){
  width:12%;
}


/* COLUMN 6 - TOTAL AMOUNT */

.mainTable th:nth-child(6),
.mainTable td:nth-child(6){
  width:27%;
}


/* =========================
   TABLE HEADER
========================= */

.mainTable th{
  background:#08dada;

  padding:8px 2px;

  text-align:center;

  font-size:12px;
  line-height:1.05;

  white-space:normal;

  overflow-wrap:anywhere;
  word-break:normal;

  overflow:hidden;
}


/* =========================
   TABLE CELLS
========================= */

.mainTable td{
  border:1px solid #d9dfe2;

  height:43px;

  padding:1px;

  overflow:hidden;
}


/* =========================
   INPUTS
========================= */

.mainTable input{
  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  height:39px;

  border:0;
  outline:0;

  background:transparent;

  padding:3px 2px;

  font-size:15px;

  color:#172024;
}

.mainTable input.num{
  text-align:center;
}


/* =========================
   CALCULATED CELLS
========================= */

.mainTable .calc{
  text-align:center;

  padding:3px 1px;

  font-size:13px;

  font-variant-numeric:
    tabular-nums;

  background:#f8fafb;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:clip;
}


/* =========================
   SUMMARY
========================= */

.summary{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:6px;

  padding:7px;
}

.box{
  background:#08dada;

  border-radius:8px;

  padding:7px 9px;

  min-width:0;
}

.box span{
  font-size:12px;
}

.box strong{
  display:block;

  text-align:right;

  font-size:17px;

  margin-top:3px;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================
   AMOUNT / DEDUCTIONS
========================= */

.amount{
  width:100%;
  max-width:100%;

  padding:0 7px 7px;

  overflow:hidden;
}

.amount table{
  width:100%;
  max-width:100%;
  min-width:0;

  border-collapse:collapse;

  table-layout:fixed;
}

.amount th{
  background:#08dada;

  padding:8px 4px;

  text-align:left;

  font-size:12px;
}

.amount th:last-child{
  text-align:right;
}

.amount td{
  height:40px;

  border:1px solid #d9dfe2;

  padding:2px 4px;
}

.amount .deduct{
  display:block;

  width:100%;
  max-width:100%;

  text-align:right;

  border:0;
  outline:0;

  background:transparent;

  font-size:15px;
}

.amountTotal{
  font-weight:700;
}


/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;

  flex-wrap:wrap;

  gap:5px;

  width:100%;
  max-width:100%;

  padding:7px 7px 10px;
}

.actions button{
  flex:1 1 auto;

  min-width:0;

  border:0;

  border-radius:9px;

  padding:10px 6px;

  font-size:12px;

  font-weight:700;

  white-space:nowrap;
}

.add{
  background:#08dada;
}

.remove{
  background:#ffdede;
}

.saveBtn{
  background:#dffafa;
}

.png{
  background:#dffafa;
}

.clear{
  background:#e7eeee;
}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:600px){

  .app{
    padding:3px;
  }

  .top{
    margin-bottom:4px;
  }

  h1{
    font-size:18px;
  }

  .save{
    display:none;
  }


  /* CLIENT TABS */

  .clientTab,
  .newClient{
    font-size:11px;
    padding:8px 9px;
  }


  /* MAIN TABLE */

  .scroll{
    width:100%;
    max-width:100%;
    overflow:hidden;
  }

  .mainTable{
    width:100%;
    max-width:100%;
    min-width:0;

    table-layout:fixed;
  }


  /* HEADER */

  .mainTable th{
    font-size:9px;

    line-height:1.05;

    padding:7px 1px;

    white-space:normal;

    overflow-wrap:anywhere;
  }


  /* CELLS */

  .mainTable td{
    height:43px;
    padding:1px;
  }


  /* INPUT */

  .mainTable input{
    width:100%;
    max-width:100%;
    min-width:0;

    height:39px;

    padding:3px 1px;

    font-size:12px;
  }

  .mainTable .calc{
    font-size:11px;

    padding:3px 1px;
  }


  /* SUMMARY */

  .summary{
    grid-template-columns:1fr 1fr;

    gap:5px;

    padding:6px;
  }

  .box{
    padding:6px 7px;
  }

  .box span{
    font-size:10px;
  }

  .box strong{
    font-size:15px;
  }


  /* AMOUNT */

  .amount{
    padding:0 6px 6px;
  }


  /* BUTTONS */

  .actions{
    display:grid;

    grid-template-columns:
      repeat(3,1fr);

    gap:4px;

    padding:6px;
  }

  .actions button{
    width:100%;

    min-width:0;

    padding:10px 2px;

    font-size:10px;
  }

}


/* =========================
   VERY SMALL IPHONE
========================= */

@media(max-width:390px){

  h1{
    font-size:17px;
  }

  .mainTable th{
    font-size:8px;
  }

  .mainTable input{
    font-size:11px;
  }

  .mainTable .calc{
    font-size:10px;
  }

  .actions{
    grid-template-columns:
      repeat(3,1fr);
  }

  .actions button{
    font-size:9px;
  }

}

</style>

</head>


<body>

<div class="app">


  <!-- =====================
       TOP
  ====================== -->

  <div class="top">

    <h1>T-Post</h1>

    <span
      class="save"
      id="saveState">
      Saved
    </span>

  </div>


  <!-- =====================
       CLIENT TABS
  ====================== -->

  <div
    class="clientBar"
    id="clientBar">
  </div>


  <!-- =====================
       CARD
  ====================== -->

  <div class="card">


    <!-- =====================
         MAIN TABLE
    ====================== -->

    <div class="scroll">

      <table class="mainTable">

        <colgroup>

          <col style="width:25%">
          <col style="width:12%">
          <col style="width:9%">
          <col style="width:15%">
          <col style="width:12%">
          <col style="width:27%">

        </colgroup>


        <thead>

          <tr>

            <th>Name</th>

            <th>Qty</th>

            <th>kg/bag</th>

            <th>Kilo</th>

            <th>Price</th>

            <th>Total Amount</th>

          </tr>

        </thead>


        <tbody id="rows">
        </tbody>

      </table>

    </div>


    <!-- =====================
         SUMMARY
    ====================== -->

    <div class="summary">

      <div class="box">

        <span>
          Σ kilo
        </span>

        <strong id="sumKilo">
          0
        </strong>

      </div>


      <div class="box">

        <span>
          Σ Total Amount
        </span>

        <strong id="sumAmount">
          0
        </strong>

      </div>

    </div>


    <!-- =====================
         DEDUCTIONS
    ====================== -->

    <div class="amount">

      <table>

        <thead>

          <tr>

            <th>
              Amount
            </th>

            <th>
              Amount
            </th>

          </tr>

        </thead>


        <tbody id="deductions">
        </tbody>


        <tfoot>

          <tr>

            <td class="amountTotal">
              Amount total
            </td>

            <td
              class="calc amountTotal"
              id="amountTotal">
              0
            </td>

          </tr>

        </tfoot>

      </table>

    </div>


    <!-- =====================
         BUTTONS
    ====================== -->

    <div class="actions">

      <button
        class="add"
        id="add">
        ＋ Add Row
      </button>


      <button
        class="remove"
        id="remove">
        − Remove Row
      </button>


      <button
        class="saveBtn"
        id="saveToday">
        💾 Save
      </button>


      <button
        class="png"
        id="savePNG">
        📷 PNG
      </button>


      <button
        class="clear"
        id="clear">
        Clear
      </button>

    </div>


  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const rowsEl =
  document.querySelector('#rows');

const dedEl =
  document.querySelector('#deductions');

const clientBar =
  document.querySelector('#clientBar');

const saveState =
  document.querySelector('#saveState');


/* =========================
   STORAGE KEYS
========================= */

const CLIENT_KEY =
  'TPOST_CLIENTS_V4';

const SNAPSHOT_KEY =
  'TPOST_SNAPSHOTS_V1';


/* =========================
   CLIENTS
========================= */

let clients = {};

let currentClient = null;


/* =========================
   BLANK ROW
========================= */

function blank(){

  return {
    name:'',
    qty:'',
    kgBag:'',
    price:''
  };

}


/* =========================
   NUMBER
========================= */

function num(v){

  return Number.parseFloat(v) || 0;

}


/* =========================
   FORMAT
========================= */

function fmt(v){

  if(Number.isInteger(v)){
    return String(v);
  }

  return v
    .toFixed(2)
    .replace(/\.?0+$/,'');

}


/* =========================
   CREATE INPUT
========================= */

function makeInput(
  cls,
  value,
  type='text'
){

  const e =
    document.createElement('input');

  e.className =
    cls;

  e.value =
    value || '';

  e.type =
    type;

  if(type === 'number'){

    e.step =
      'any';

    e.inputMode =
      'decimal';

  }

  return e;

}


/* =========================
   ADD MAIN ROW
========================= */

function addRow(data=blank()){

  const tr =
    document.createElement('tr');


  /* NAME */

  const name =
    makeInput(
      '',
      data.name
    );


  /* QTY */

  const qty =
    makeInput(
      'num',
      data.qty,
      'number'
    );


  /* KG/BAG */

  const kg =
    makeInput(
      'num',
      data.kgBag,
      'number'
    );


  /* PRICE */

  const price =
    makeInput(
      'num',
      data.price,
      'number'
    );


  /* KILO */

  const kilo =
    document.createElement('td');

  kilo.className =
    'calc kilo';


  /* TOTAL */

  const total =
    document.createElement('td');

  total.className =
    'calc total';


  const cells = [
    name,
    qty,
    kg,
    kilo,
    price,
    total
  ];


  cells.forEach((x,i)=>{

    let td;

    if(i === 3 || i === 5){

      td = x;

    }else{

      td =
        document.createElement('td');

      td.appendChild(x);

    }

    tr.appendChild(td);

  });


  /* AUTO CALCULATE + SAVE */

  [
    name,
    qty,
    kg,
    price
  ].forEach(inputEl=>{

    inputEl.addEventListener(
      'input',
      ()=>{
        calculate();
        autoSave();
      }
    );

  });


  rowsEl.appendChild(tr);

}


/* =========================
   ADD DEDUCTION ROW
========================= */

function addDeduction(value=''){

  const tr =
    document.createElement('tr');


  const a =
    document.createElement('td');


  const b =
    document.createElement('td');


  const x =
    makeInput(
      'deduct',
      value,
      'number'
    );


  b.appendChild(x);

  tr.appendChild(a);

  tr.appendChild(b);


  x.addEventListener(
    'input',
    ()=>{
      calculate();
      autoSave();
    }
  );


  dedEl.appendChild(tr);

}


/* =========================
   GET CURRENT DATA
========================= */

function getData(){

  return {

    rows:
      [...rowsEl.rows]
        .map(r=>({

          name:
            r.cells[0]
             .firstChild.value,

          qty:
            r.cells[1]
             .firstChild.value,

          kgBag:
            r.cells[2]
             .firstChild.value,

          price:
            r.cells[4]
             .firstChild.value

        })),

    ded:
      [...document
        .querySelectorAll('.deduct')]
        .map(x=>x.value)

  };

}


/* =========================
   SAVE CURRENT CLIENT
========================= */

function autoSave(){

  if(!currentClient){
    return;
  }


  clients[currentClient] =
    getData();


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  saveState.textContent =
    'Saved';

}


/* =========================
   LOAD CLIENTS
========================= */

function loadClients(){

  try{

    clients =
      JSON.parse(
        localStorage.getItem(
          CLIENT_KEY
        )
      ) || {};

  }catch(error){

    clients = {};

  }


  const names =
    Object.keys(clients);


  if(names.length === 0){

    currentClient =
      'Client 1';


    clients[currentClient] = {

      rows:[],

      ded:[]

    };


    localStorage.setItem(
      CLIENT_KEY,
      JSON.stringify(clients)
    );

  }else{

    currentClient =
      names[0];

  }

}


/* =========================
   RENDER CLIENT TABS
========================= */

function renderTabs(){

  clientBar.innerHTML =
    '';


  Object.keys(clients)
    .forEach(name=>{

      const button =
        document.createElement('button');


      button.className =
        'clientTab';


      if(
        name === currentClient
      ){

        button.classList.add(
          'active'
        );

      }


      button.textContent =
        name;


      button.onclick =
        ()=>{
          switchClient(name);
        };


      /*
         Double-click to delete
         a client tab.
      */

      button.ondblclick =
        ()=>{
          deleteClient(name);
        };


      clientBar.appendChild(
        button
      );

    });


  /* NEW CLIENT BUTTON */

  const newButton =
    document.createElement('button');


  newButton.className =
    'newClient';


  newButton.textContent =
    '＋ New';


  newButton.onclick =
    createClient;


  clientBar.appendChild(
    newButton
  );

}


/* =========================
   LOAD CLIENT DATA
========================= */

function loadClient(){

  rowsEl.innerHTML =
    '';

  dedEl.innerHTML =
    '';


  const data =
    clients[currentClient] || {

      rows:[],

      ded:[]

    };


  /*
     Load saved rows.
  */

  (data.rows || [])
    .forEach(addRow);


  /*
     IMPORTANT:
     Start with only 10 rows.
  */

  while(
    rowsEl.children.length < 10
  ){

    addRow();

  }


  /*
     Load deductions.
  */

  (data.ded || [])
    .forEach(addDeduction);


  /*
     Keep 13 deduction rows.
  */

  while(
    dedEl.children.length < 13
  ){

    addDeduction();

  }


  calculate();

}


/* =========================
   SWITCH CLIENT
========================= */

function switchClient(name){

  autoSave();


  currentClient =
    name;


  loadClient();

  renderTabs();


  saveState.textContent =
    'Saved';

}


/* =========================
   CREATE NEW CLIENT
========================= */

function createClient(){

  const name =
    prompt(
      'Enter client name:'
    );


  if(name === null){
    return;
  }


  const cleanName =
    name.trim();


  if(!cleanName){

    alert(
      'Please enter a client name.'
    );

    return;

  }


  if(
    clients[cleanName]
  ){

    alert(
      'That client already exists.'
    );

    return;

  }


  /* SAVE OLD CLIENT */

  autoSave();


  /* CREATE NEW CLIENT */

  clients[cleanName] = {

    rows:[],

    ded:[]

  };


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  currentClient =
    cleanName;


  loadClient();

  renderTabs();


  saveState.textContent =
    'Saved';

}


/* =========================
   DELETE CLIENT
========================= */

function deleteClient(name){

  if(
    !confirm(
      'Delete "' +
      name +
      '" and all its data?'
    )
  ){

    return;

  }


  delete clients[name];


  const names =
    Object.keys(clients);


  if(names.length === 0){

    currentClient =
      'Client 1';


    clients[currentClient] = {

      rows:[],

      ded:[]

    };

  }else if(
    currentClient === name
  ){

    currentClient =
      names[0];

  }


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  loadClient();

  renderTabs();

}


/* =========================
   CALCULATE
========================= */

function calculate(){

  let totalKilo = 0;

  let totalAmount = 0;


  [...rowsEl.rows]
    .forEach(row=>{

      const qty =
        num(
          row.cells[1]
             .firstChild.value
        );


      const kgBag =
        num(
          row.cells[2]
             .firstChild.value
        );


      const price =
        num(
          row.cells[4]
             .firstChild.value
        );


      /*
         KILO = QTY × KG/BAG
      */

      const kilo =
        qty * kgBag;


      /*
         TOTAL = KILO × PRICE
      */

      const amount =
        kilo * price;


      row.querySelector(
        '.kilo'
      ).textContent =
        fmt(kilo);


      row.querySelector(
        '.total'
      ).textContent =
        fmt(amount);


      totalKilo +=
        kilo;


      totalAmount +=
        amount;

    });


  /* DEDUCTIONS */

  let deductions = 0;


  document
    .querySelectorAll('.deduct')
    .forEach(inputEl=>{

      deductions +=
        num(inputEl.value);

    });


  /* SUMMARY */

  document.querySelector(
    '#sumKilo'
  ).textContent =
    fmt(totalKilo);


  document.querySelector(
    '#sumAmount'
  ).textContent =
    fmt(totalAmount);


  document.querySelector(
    '#amountTotal'
  ).textContent =
    fmt(
      totalAmount -
      deductions
    );

}


/* =========================
   ADD ROW
========================= */

document
  .querySelector('#add')
  .onclick = ()=>{

    addRow();

    calculate();

    autoSave();


    /*
       Move to the newly added row.
    */

    setTimeout(()=>{

      const last =
        rowsEl.lastElementChild;

      if(last){

        last.scrollIntoView({
          behavior:'smooth',
          block:'center'
        });

      }

    },100);

  };


/* =========================
   REMOVE ROW
========================= */

document
  .querySelector('#remove')
  .onclick = ()=>{

    const rows =
      rowsEl.querySelectorAll('tr');


    /*
       Keep at least 1 row.
    */

    if(rows.length <= 1){

      alert(
        'At least one row must remain.'
      );

      return;

    }


    /*
       Remove the LAST row.
    */

    rowsEl
      .lastElementChild
      .remove();


    calculate();

    autoSave();

  };


/* =========================
   SAVE NAMED COPY
========================= */

document
  .querySelector('#saveToday')
  .onclick = ()=>{

    const name =
      prompt(
        'Enter a name for this saved calculation:'
      );


    if(name === null){
      return;
    }


    const cleanName =
      name.trim();


    if(!cleanName){

      alert(
        'Please enter a name.'
      );

      return;

    }


    let snapshots = {};


    try{

      snapshots =
        JSON.parse(
          localStorage.getItem(
            SNAPSHOT_KEY
          )
        ) || {};

    }catch(error){

      snapshots = {};

    }


    snapshots[cleanName] =
      getData();


    localStorage.setItem(
      SNAPSHOT_KEY,
      JSON.stringify(
        snapshots
      )
    );


    /*
       Also save current client.
    */

    autoSave();


    saveState.textContent =
      'Saved: ' + cleanName;


    alert(
      'Saved as "' +
      cleanName +
      '"'
    );

  };


/* =========================
   CLEAR CURRENT CLIENT
========================= */

document
  .querySelector('#clear')
  .onclick = ()=>{

    if(
      !confirm(
        'Clear all entries for "' +
        currentClient +
        '"?'
      )
    ){

      return;

    }


    rowsEl.innerHTML =
      '';

    dedEl.innerHTML =
      '';


    /*
       Reset to exactly 10 rows.
    */

    for(
      let i=0;
      i<10;
      i++
    ){

      addRow();

    }


    /*
       Reset deductions.
    */

    for(
      let i=0;
      i<13;
      i++
    ){

      addDeduction();

    }


    calculate();

    autoSave();

  };


/* =========================
   START APP
========================= */

loadClients();

renderTabs();

loadClient();

calculate();


/* =========================
   SERVICE WORKER
========================= */

if(
  'serviceWorker' in navigator
){

  window.addEventListener(
    'load',
    ()=>{

      navigator.serviceWorker
        .register('sw.js')
        .catch(()=>{});

    }
  );

}

</script>
