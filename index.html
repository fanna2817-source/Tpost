<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#08dada">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="T-Post">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>T-Post</title>

<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  background:#f4f7f8;
  color:#172024;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.app{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:4px;
}


/* =========================
   TOP
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:20px;
  line-height:1.2;
}

.save{
  font-size:11px;
  color:#667;
}


/* =========================
   CLIENT TABS
========================= */

.clientBar{
  display:flex;
  align-items:flex-end;
  gap:4px;

  width:100%;
  max-width:100%;

  overflow-x:auto;
  overflow-y:hidden;

  padding:2px 0 5px;

  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.clientBar::-webkit-scrollbar{
  display:none;
}

.clientTab{
  flex:0 0 auto;

  border:0;
  border-radius:9px 9px 0 0;

  padding:8px 12px;

  background:#dfe8e9;
  color:#172024;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
}

.clientTab.active{
  background:#08dada;
}

.newClient{
  flex:0 0 auto;

  border:0;
  border-radius:9px;

  padding:8px 11px;

  background:#172024;
  color:#fff;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
}


/* =========================
   CARD
========================= */

.card{
  width:100%;
  max-width:100%;

  background:#fff;

  border-radius:0 14px 14px 14px;

  box-shadow:0 2px 10px #0001;

  overflow:hidden;
}


/* =========================
   MAIN TABLE WRAPPER
========================= */

.scroll{
  width:100%;
  max-width:100%;
  overflow:hidden;
}


/* =========================
   MAIN TABLE
========================= */

.mainTable{

  width:100%;
  max-width:100%;
  min-width:0;

  border-collapse:collapse;
  table-layout:fixed;

  --c1:25%;
  --c2:12%;
  --c3:9%;
  --c4:15%;
  --c5:12%;
  --c6:27%;
}


/* =========================
   COLUMN WIDTHS
========================= */

.mainTable col:nth-child(1){
  width:var(--c1);
}

.mainTable col:nth-child(2){
  width:var(--c2);
}

.mainTable col:nth-child(3){
  width:var(--c3);
}

.mainTable col:nth-child(4){
  width:var(--c4);
}

.mainTable col:nth-child(5){
  width:var(--c5);
}

.mainTable col:nth-child(6){
  width:var(--c6);
}


/* =========================
   HEADER
========================= */

.mainTable th{

  position:relative;

  background:#08dada;

  padding:8px 3px;

  text-align:center;

  font-size:12px;
  line-height:1.05;

  white-space:normal;

  overflow-wrap:anywhere;

  overflow:hidden;
}


/* =========================
   DRAGGABLE DIVIDERS
========================= */

.resizeHandle{

  position:absolute;

  top:0;
  right:-7px;

  width:14px;
  height:100%;

  z-index:20;

  cursor:col-resize;

  touch-action:none;
}

.resizeHandle::after{

  content:"";

  position:absolute;

  top:15%;
  bottom:15%;
  left:6px;

  width:3px;

  border-radius:3px;

  background:#ffffff99;
}

.resizeHandle:active::after{

  background:#172024;
}


/* =========================
   CELLS
========================= */

.mainTable td{

  border:1px solid #d9dfe2;

  height:43px;

  padding:1px;

  overflow:hidden;
}


/* =========================
   INPUTS
========================= */

.mainTable input{

  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  height:39px;

  border:0;
  outline:0;

  background:transparent;

  padding:3px 2px;

  font-size:15px;

  color:#172024;
}

.mainTable input.num{
  text-align:center;
}


/* =========================
   CALCULATED CELLS
========================= */

.mainTable .calc{

  text-align:center;

  padding:3px 1px;

  font-size:13px;

  font-variant-numeric:tabular-nums;

  background:#f8fafb;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:clip;
}


/* =========================
   SUMMARY
========================= */

.summary{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:6px;

  padding:7px;
}

.box{

  background:#08dada;

  border-radius:8px;

  padding:7px 9px;

  min-width:0;
}

.box span{
  font-size:12px;
}

.box strong{

  display:block;

  text-align:right;

  font-size:17px;

  margin-top:3px;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================
   AMOUNT SECTION
========================= */

.amount{

  width:100%;
  max-width:100%;

  padding:0 7px 7px;

  overflow:hidden;
}

.amount table{

  width:100%;
  max-width:100%;
  min-width:0;

  border-collapse:collapse;

  table-layout:fixed;
}


/* First Amount column = notes */

.amount th:first-child,
.amount td:first-child{
  width:50%;
}

/* Second Amount column = amount */

.amount th:last-child,
.amount td:last-child{
  width:50%;
}

.amount th{

  background:#08dada;

  padding:8px 4px;

  text-align:left;

  font-size:12px;
}

.amount th:last-child{
  text-align:right;
}

.amount td{

  height:40px;

  border:1px solid #d9dfe2;

  padding:2px 4px;
}


/* =========================
   AMOUNT NOTE INPUT
========================= */

.amount .noteInput{

  display:block;

  width:100%;
  max-width:100%;

  height:35px;

  border:0;
  outline:0;

  background:transparent;

  font-size:15px;

  padding:4px;

  color:#172024;

  text-align:left;
}


/* =========================
   AMOUNT NUMBER INPUT
========================= */

.amount .deduct{

  display:block;

  width:100%;
  max-width:100%;

  height:35px;

  text-align:right;

  border:0;
  outline:0;

  background:transparent;

  font-size:15px;

  padding:4px;
}


/* =========================
   AMOUNT TOTAL
========================= */

.amountTotal{
  font-weight:700;
}

.amount .calc{
  text-align:right;
}


/* =========================
   BUTTONS
========================= */

.actions{

  display:flex;

  flex-wrap:nowrap;

  gap:4px;

  width:100%;
  max-width:100%;

  padding:7px;

  overflow:hidden;
}

.actions button{

  flex:1 1 0;

  width:20%;
  min-width:0;

  border:0;

  border-radius:9px;

  padding:10px 2px;

  font-size:11px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:clip;
}

.add{
  background:#08dada;
}

.remove{
  background:#ffdede;
}

.saveBtn{
  background:#dffafa;
}

.png{
  background:#dffafa;
}

.clear{
  background:#e7eeee;
}


/* =========================
   IPHONE
========================= */

@media(max-width:600px){

  .app{
    padding:3px;
  }

  .top{
    margin-bottom:4px;
  }

  h1{
    font-size:18px;
  }

  .save{
    display:none;
  }


  /* CLIENT TABS */

  .clientTab,
  .newClient{
    font-size:11px;
    padding:8px 9px;
  }


  /* MAIN TABLE */

  .scroll{

    width:100%;
    max-width:100%;

    overflow:hidden;
  }

  .mainTable{

    width:100%;
    max-width:100%;
    min-width:0;

    table-layout:fixed;
  }


  /* HEADER */

  .mainTable th{

    font-size:9px;

    line-height:1.05;

    padding:7px 1px;

    white-space:normal;

    overflow-wrap:anywhere;
  }


  /* CELLS */

  .mainTable td{

    height:43px;

    padding:1px;
  }


  /* INPUT */

  .mainTable input{

    width:100%;
    max-width:100%;
    min-width:0;

    height:39px;

    padding:3px 1px;

    font-size:12px;
  }

  .mainTable input.num{
    text-align:center;
  }

  .mainTable .calc{

    font-size:11px;

    padding:3px 1px;
  }


  /* SUMMARY */

  .summary{

    grid-template-columns:1fr 1fr;

    gap:5px;

    padding:6px;
  }

  .box{
    padding:6px 7px;
  }

  .box span{
    font-size:10px;
  }

  .box strong{
    font-size:15px;
  }


  /* AMOUNT */

  .amount{
    padding:0 6px 6px;
  }

  .amount .noteInput{
    font-size:13px;
  }

  .amount .deduct{
    font-size:13px;
  }


  /* BUTTONS */

  .actions{

    display:flex;

    flex-wrap:nowrap;

    gap:3px;

    padding:6px;

    overflow:hidden;
  }

  .actions button{

    flex:1 1 0;

    width:20%;

    min-width:0;

    padding:10px 1px;

    font-size:9px;

    border-radius:8px;
  }

}


/* =========================
   VERY SMALL IPHONE
========================= */

@media(max-width:390px){

  h1{
    font-size:17px;
  }

  .mainTable th{
    font-size:8px;
  }

  .mainTable input{
    font-size:11px;
  }

  .mainTable .calc{
    font-size:10px;
  }

  .amount .noteInput,
  .amount .deduct{
    font-size:12px;
  }

  .actions{
    gap:2px;
  }

  .actions button{

    padding:9px 1px;

    font-size:8px;
  }

}

</style>

</head>


<body>

<div class="app">


  <!-- =========================
       TOP
  ========================== -->

  <div class="top">

    <h1>T-Post</h1>

    <span
      class="save"
      id="saveState">
      Saved
    </span>

  </div>


  <!-- =========================
       CLIENT TABS
  ========================== -->

  <div
    class="clientBar"
    id="clientBar">
  </div>


  <!-- =========================
       CARD
  ========================== -->

  <div class="card">


    <!-- =========================
         MAIN TABLE
    ========================== -->

    <div class="scroll">

      <table class="mainTable">

        <colgroup>

          <col>
          <col>
          <col>
          <col>
          <col>
          <col>

        </colgroup>


        <thead>

          <tr>

            <th>
              Name
              <span class="resizeHandle"
                    data-col="0"></span>
            </th>

            <th>
              Qty
              <span class="resizeHandle"
                    data-col="1"></span>
            </th>

            <th>
              kg/bag
              <span class="resizeHandle"
                    data-col="2"></span>
            </th>

            <th>
              Kilo
              <span class="resizeHandle"
                    data-col="3"></span>
            </th>

            <th>
              Price
              <span class="resizeHandle"
                    data-col="4"></span>
            </th>

            <th>
              Total Amount
            </th>

          </tr>

        </thead>


        <tbody id="rows">
        </tbody>

      </table>

    </div>


    <!-- =========================
         SUMMARY
    ========================== -->

    <div class="summary">

      <div class="box">

        <span>
          Σ kilo
        </span>

        <strong id="sumKilo">
          0
        </strong>

      </div>


      <div class="box">

        <span>
          Σ Total Amount
        </span>

        <strong id="sumAmount">
          0
        </strong>

      </div>

    </div>


    <!-- =========================
         AMOUNT / DEDUCTIONS
    ========================== -->

    <div class="amount">

      <table>

        <thead>

          <tr>

            <th>
              Notes
            </th>

            <th>
              Amount
            </th>

          </tr>

        </thead>


        <tbody id="deductions">
        </tbody>


        <tfoot>

          <tr>

            <td class="amountTotal">
              Amount total
            </td>

            <td
              class="calc amountTotal"
              id="amountTotal">
              0
            </td>

          </tr>

        </tfoot>

      </table>

    </div>


    <!-- =========================
         BUTTONS
    ========================== -->

    <div class="actions">

      <button
        class="add"
        id="add">
        ＋ Add
      </button>


      <button
        class="remove"
        id="remove">
        − Remove
      </button>


      <button
        class="saveBtn"
        id="saveToday">
        💾 Save
      </button>


      <button
        class="png"
        id="savePNG">
        📷 PNG
      </button>


      <button
        class="clear"
        id="clear">
        Clear
      </button>

    </div>


  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const rowsEl =
  document.querySelector('#rows');

const dedEl =
  document.querySelector('#deductions');

const clientBar =
  document.querySelector('#clientBar');

const saveState =
  document.querySelector('#saveState');

const mainTable =
  document.querySelector('.mainTable');


/* =========================
   STORAGE
========================= */

const CLIENT_KEY =
  'TPOST_CLIENTS_V6';

const SNAPSHOT_KEY =
  'TPOST_SNAPSHOTS_V6';

const WIDTH_KEY =
  'TPOST_WIDTHS_V6';


let clients = {};

let currentClient = null;


/* =========================
   DEFAULT COLUMN WIDTHS
========================= */

let columnWidths = [
  25,
  12,
  9,
  15,
  12,
  27
];


/* =========================
   BLANK ROW
========================= */

function blank(){

  return {
    name:'',
    qty:'',
    kgBag:'',
    price:''
  };

}


/* =========================
   NUMBER
========================= */

function num(v){

  return Number.parseFloat(v) || 0;

}


/* =========================
   FORMAT
========================= */

function fmt(v){

  if(Number.isInteger(v)){
    return String(v);
  }

  return v
    .toFixed(2)
    .replace(/\.?0+$/,'');
}


/* =========================
   INPUT CREATOR
========================= */

function makeInput(
  cls,
  value,
  type='text'
){

  const e =
    document.createElement('input');

  e.className =
    cls;

  e.value =
    value || '';

  e.type =
    type;

  if(type === 'number'){

    e.step =
      'any';

    e.inputMode =
      'decimal';

  }

  return e;

}


/* =========================
   APPLY COLUMN WIDTHS
========================= */

function applyWidths(){

  mainTable.style.setProperty(
    '--c1',
    columnWidths[0] + '%'
  );

  mainTable.style.setProperty(
    '--c2',
    columnWidths[1] + '%'
  );

  mainTable.style.setProperty(
    '--c3',
    columnWidths[2] + '%'
  );

  mainTable.style.setProperty(
    '--c4',
    columnWidths[3] + '%'
  );

  mainTable.style.setProperty(
    '--c5',
    columnWidths[4] + '%'
  );

  mainTable.style.setProperty(
    '--c6',
    columnWidths[5] + '%'
  );

}


/* =========================
   SAVE COLUMN WIDTHS
========================= */

function saveWidths(){

  localStorage.setItem(
    WIDTH_KEY,
    JSON.stringify(columnWidths)
  );

}


/* =========================
   LOAD COLUMN WIDTHS
========================= */

function loadWidths(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          WIDTH_KEY
        )
      );

    if(
      Array.isArray(saved) &&
      saved.length === 6
    ){

      columnWidths =
        saved.map(Number);

    }

  }catch(error){}

  applyWidths();

}


/* =========================
   DRAGGABLE DIVIDERS
========================= */

function setupDividers(){

  const handles =
    document.querySelectorAll(
      '.resizeHandle'
    );


  handles.forEach(handle=>{

    handle.addEventListener(
      'pointerdown',
      startResize
    );

  });

}


/* =========================
   START RESIZE
========================= */

function startResize(event){

  event.preventDefault();

  const index =
    Number(
      event.currentTarget.dataset.col
    );


  if(index >= 5){
    return;
  }


  const startX =
    event.clientX;

  const tableWidth =
    mainTable.getBoundingClientRect().width;


  const startLeft =
    columnWidths[index];

  const startRight =
    columnWidths[index + 1];


  function moveResize(e){

    const difference =
      ((e.clientX - startX) /
      tableWidth) * 100;


    let newLeft =
      startLeft + difference;

    let newRight =
      startRight - difference;


    /*
       Minimum width prevents
       a column from disappearing.
    */

    const minLeft =
      index === 0 ? 12 : 6;

    const minRight =
      index + 1 === 5 ? 15 : 6;


    if(newLeft < minLeft){

      newLeft = minLeft;

      newRight =
        startLeft +
        startRight -
        newLeft;

    }


    if(newRight < minRight){

      newRight = minRight;

      newLeft =
        startLeft +
        startRight -
        newRight;

    }


    columnWidths[index] =
      newLeft;

    columnWidths[index + 1] =
      newRight;


    applyWidths();

  }


  function stopResize(){

    document.removeEventListener(
      'pointermove',
      moveResize
    );

    document.removeEventListener(
      'pointerup',
      stopResize
    );


    saveWidths();

  }


  document.addEventListener(
    'pointermove',
    moveResize
  );

  document.addEventListener(
    'pointerup',
    stopResize
  );

}


/* =========================
   ADD MAIN ROW
========================= */

function addRow(data=blank()){

  const tr =
    document.createElement('tr');


  const name =
    makeInput(
      '',
      data.name
    );


  const qty =
    makeInput(
      'num',
      data.qty,
      'number'
    );


  const kg =
    makeInput(
      'num',
      data.kgBag,
      'number'
    );


  const price =
    makeInput(
      'num',
      data.price,
      'number'
    );


  const kilo =
    document.createElement('td');

  kilo.className =
    'calc kilo';


  const total =
    document.createElement('td');

  total.className =
    'calc total';


  const cells = [
    name,
    qty,
    kg,
    kilo,
    price,
    total
  ];


  cells.forEach((x,i)=>{

    let td;


    if(i === 3 || i === 5){

      td = x;

    }else{

      td =
        document.createElement('td');

      td.appendChild(x);

    }


    tr.appendChild(td);

  });


  [
    name,
    qty,
    kg,
    price
  ].forEach(inputEl=>{

    inputEl.addEventListener(
      'input',
      ()=>{
        calculate();
        autoSave();
      }
    );

  });


  rowsEl.appendChild(tr);

}


/* =========================
   ADD DEDUCTION
========================= */

function addDeduction(
  data=''
){

  /*
     Supports both:

     OLD:
     "500"

     NEW:
     {
       note:"Delivery",
       amount:"500"
     }
  */

  let noteValue = '';
  let amountValue = '';


  if(
    typeof data === 'object' &&
    data !== null
  ){

    noteValue =
      data.note || '';

    amountValue =
      data.amount || '';

  }else{

    amountValue =
      data || '';

  }


  const tr =
    document.createElement('tr');


  /* NOTES CELL */

  const noteCell =
    document.createElement('td');


  const note =
    makeInput(
      'noteInput',
      noteValue,
      'text'
    );


  noteCell.appendChild(note);


  /* AMOUNT CELL */

  const amountCell =
    document.createElement('td');


  const amount =
    makeInput(
      'deduct',
      amountValue,
      'number'
    );


  amountCell.appendChild(amount);


  tr.appendChild(noteCell);

  tr.appendChild(amountCell);


  note.addEventListener(
    'input',
    ()=>{
      autoSave();
    }
  );


  amount.addEventListener(
    'input',
    ()=>{
      calculate();
      autoSave();
    }
  );


  dedEl.appendChild(tr);

}


/* =========================
   GET DATA
========================= */

function getData(){

  return {

    rows:
      [...rowsEl.rows]
      .map(r=>({

        name:
          r.cells[0]
           .firstChild.value,

        qty:
          r.cells[1]
           .firstChild.value,

        kgBag:
          r.cells[2]
           .firstChild.value,

        price:
          r.cells[4]
           .firstChild.value

      })),


    ded:
      [...dedEl.rows]
      .map(r=>({

        note:
          r.cells[0]
           .firstChild.value,

        amount:
          r.cells[1]
           .firstChild.value

      }))

  };

}


/* =========================
   AUTO SAVE
========================= */

function autoSave(){

  if(!currentClient){
    return;
  }


  clients[currentClient] =
    getData();


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  saveState.textContent =
    'Saved';

}


/* =========================
   LOAD CLIENTS
========================= */

function loadClients(){

  try{

    clients =
      JSON.parse(
        localStorage.getItem(
          CLIENT_KEY
        )
      ) || {};

  }catch(error){

    clients = {};

  }


  const names =
    Object.keys(clients);


  if(names.length === 0){

    currentClient =
      'Client 1';


    clients[currentClient] = {

      rows:[],
      ded:[]

    };

  }else{

    currentClient =
      names[0];

  }


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );

}


/* =========================
   RENDER CLIENT TABS
========================= */

function renderTabs(){

  clientBar.innerHTML =
    '';


  Object.keys(clients)
    .forEach(name=>{

      const button =
        document.createElement('button');


      button.className =
        'clientTab';


      if(
        name === currentClient
      ){

        button.classList.add(
          'active'
        );

      }


      button.textContent =
        name;


      button.onclick =
        ()=>{
          switchClient(name);
        };


      /*
         Double click deletes client.
      */

      button.ondblclick =
        ()=>{
          deleteClient(name);
        };


      clientBar.appendChild(
        button
      );

    });


  const newButton =
    document.createElement('button');


  newButton.className =
    'newClient';


  newButton.textContent =
    '＋ New';


  newButton.onclick =
    createClient;


  clientBar.appendChild(
    newButton
  );

}


/* =========================
   LOAD CLIENT
========================= */

function loadClient(){

  rowsEl.innerHTML =
    '';

  dedEl.innerHTML =
    '';


  const data =
    clients[currentClient] || {

      rows:[],
      ded:[]

    };


  /*
     Load saved rows.
  */

  (data.rows || [])
    .forEach(addRow);


  /*
     SHOW AT LEAST 10 ROWS
  */

  while(
    rowsEl.children.length < 10
  ){

    addRow();

  }


  /*
     Load saved deductions.
  */

  (data.ded || [])
    .forEach(addDeduction);


  /*
     Keep 13 deduction rows.
  */

  while(
    dedEl.children.length < 13
  ){

    addDeduction();

  }


  calculate();

}


/* =========================
   SWITCH CLIENT
========================= */

function switchClient(name){

  autoSave();

  currentClient =
    name;

  loadClient();

  renderTabs();

}


/* =========================
   NEW CLIENT
========================= */

function createClient(){

  const name =
    prompt(
      'Enter client name:'
    );


  if(name === null){
    return;
  }


  const cleanName =
    name.trim();


  if(!cleanName){

    alert(
      'Please enter a client name.'
    );

    return;

  }


  if(
    clients[cleanName]
  ){

    alert(
      'That client already exists.'
    );

    return;

  }


  autoSave();


  clients[cleanName] = {

    rows:[],
    ded:[]

  };


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  currentClient =
    cleanName;


  loadClient();

  renderTabs();


  saveState.textContent =
    'Saved';

}


/* =========================
   DELETE CLIENT
========================= */

function deleteClient(name){

  if(
    !confirm(
      'Delete "' +
      name +
      '" and all its data?'
    )
  ){

    return;

  }


  delete clients[name];


  let names =
    Object.keys(clients);


  if(names.length === 0){

    currentClient =
      'Client 1';


    clients[currentClient] = {

      rows:[],
      ded:[]

    };

  }else if(
    currentClient === name
  ){

    currentClient =
      names[0];

  }


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  loadClient();

  renderTabs();

}


/* =========================
   CALCULATE
========================= */

function calculate(){

  let totalKilo = 0;

  let totalAmount = 0;


  [...rowsEl.rows]
    .forEach(row=>{

      const qty =
        num(
          row.cells[1]
             .firstChild.value
        );


      const kgBag =
        num(
          row.cells[2]
             .firstChild.value
        );


      const price =
        num(
          row.cells[4]
             .firstChild.value
        );


      const kilo =
        qty * kgBag;


      const amount =
        kilo * price;


      row.querySelector(
        '.kilo'
      ).textContent =
        fmt(kilo);


      row.querySelector(
        '.total'
      ).textContent =
        fmt(amount);


      totalKilo +=
        kilo;


      totalAmount +=
        amount;

    });


  let deductions = 0;


  document
    .querySelectorAll('.deduct')
    .forEach(inputEl=>{

      deductions +=
        num(inputEl.value);

    });


  document.querySelector(
    '#sumKilo'
  ).textContent =
    fmt(totalKilo);


  document.querySelector(
    '#sumAmount'
  ).textContent =
    fmt(totalAmount);


  document.querySelector(
    '#amountTotal'
  ).textContent =
    fmt(
      totalAmount -
      deductions
    );

}


/* =========================
   ADD ROW BUTTON
========================= */

document
  .querySelector('#add')
  .onclick = ()=>{

    addRow();

    calculate();

    autoSave();

  };


/* =========================
   REMOVE ROW BUTTON
========================= */

document
  .querySelector('#remove')
  .onclick = ()=>{

    const rows =
      rowsEl.querySelectorAll('tr');


    if(rows.length <= 1){

      alert(
        'At least one row must remain.'
      );

      return;

    }


    rowsEl
      .lastElementChild
      .remove();


    calculate();

    autoSave();

  };


/* =========================
   SAVE BUTTON
========================= */

document
  .querySelector('#saveToday')
  .onclick = ()=>{

    const name =
      prompt(
        'Enter a name for this saved calculation:'
      );


    if(name === null){
      return;
    }


    const cleanName =
      name.trim();


    if(!cleanName){

      alert(
        'Please enter a name.'
      );

      return;

    }


    let snapshots = {};


    try{

      snapshots =
        JSON.parse(
          localStorage.getItem(
            SNAPSHOT_KEY
          )
        ) || {};

    }catch(error){

      snapshots = {};

    }


    snapshots[cleanName] =
      getData();


    localStorage.setItem(
      SNAPSHOT_KEY,
      JSON.stringify(
        snapshots
      )
    );


    autoSave();


    saveState.textContent =
      'Saved: ' + cleanName;


    alert(
      'Saved as "' +
      cleanName +
      '"'
    );

  };


/* =========================
   PNG BUTTON
========================= */

document
  .querySelector('#savePNG')
  .onclick = ()=>{

    /*
       PNG export can be added here.
       The current calculator data is
       already saved automatically.
    */

    alert(
      'PNG feature is ready to connect to the calculator screen.'
    );

  };


/* =========================
   CLEAR BUTTON
========================= */

document
  .querySelector('#clear')
  .onclick = ()=>{

    if(
      !confirm(
        'Clear all entries for "' +
        currentClient +
        '"?'
      )
    ){

      return;

    }


    rowsEl.innerHTML =
      '';

    dedEl.innerHTML =
      '';


    /*
       RESET TO EXACTLY 10 ROWS
    */

    for(
      let i=0;
      i<10;
      i++
    ){

      addRow();

    }


    /*
       RESET DEDUCTIONS
    */

    for(
      let i=0;
      i<13;
      i++
    ){

      addDeduction();

    }


    calculate();

    autoSave();

  };


/* =========================
   START
========================= */

loadWidths();

loadClients();

renderTabs();

loadClient();

calculate();

setupDividers();


/* =========================
   SERVICE WORKER
========================= */

if(
  'serviceWorker' in navigator
){

  window.addEventListener(
    'load',
    ()=>{
      navigator.serviceWorker
        .register('sw.js')
        .catch(()=>{});
    }
  );

}

</script>
