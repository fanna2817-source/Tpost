<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#08dada">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="T-Post">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>T-Post</title>

<style>
<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  background:#f4f7f8;
  color:#172024;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:4px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

h1{
  font-size:18px;
  margin:0;
}

.save{
  font-size:12px;
  color:#667;
  opacity:.9;
}

.card{
  width:100%;
  max-width:100%;
  background:#fff;
  border-radius:14px;
  box-shadow:0 2px 10px #0001;
  overflow:hidden;
}

/* NO SIDEWAYS SCROLL */
.scroll{
  width:100%;
  max-width:100%;
  overflow:hidden;
}

/* MAIN TABLE */
.scroll > table{
  width:100%;
  max-width:100%;
  min-width:0;
  table-layout:fixed;
  border-collapse:collapse;
}

/* HEADERS */
.scroll > table th{
  background:#08dada;
  padding:6px 1px;
  text-align:center;
  font-size:10px;
  line-height:1.05;
  white-space:normal;
  overflow:hidden;
  word-break:break-word;
  overflow-wrap:anywhere;
}

/* CELLS */
.scroll > table td{
  border:1px solid #d9dfe2;
  height:43px;
  padding:1px;
  min-width:0;
  overflow:hidden;
}

/* INPUTS */
.scroll > table input{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  height:38px;
  border:0;
  outline:0;
  background:transparent;
  padding:3px 1px;
  font-size:13px;
  text-overflow:clip;
}

input.num{
  text-align:center;
}

/* CALCULATED CELLS */
.scroll > table .calc{
  text-align:center;
  padding:3px 1px;
  font-size:13px;
  font-variant-numeric:tabular-nums;
  background:#f8fafb;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
}

/* =========================
   COLUMN WIDTHS
========================= */

.scroll > table th:nth-child(1),
.scroll > table td:nth-child(1){
  width:25%;
}

.scroll > table th:nth-child(2),
.scroll > table td:nth-child(2){
  width:12%;
}

.scroll > table th:nth-child(3),
.scroll > table td:nth-child(3){
  width:9%;
}

.scroll > table th:nth-child(4),
.scroll > table td:nth-child(4){
  width:15%;
}

.scroll > table th:nth-child(5),
.scroll > table td:nth-child(5){
  width:12%;
}

.scroll > table th:nth-child(6),
.scroll > table td:nth-child(6){
  width:27%;
}


/* SUMMARY */
.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:8px;
}

.box{
  background:#08dada;
  border-radius:8px;
  padding:8px 10px;
}

.box span{
  font-size:13px;
}

.box strong{
  display:block;
  text-align:right;
  font-size:18px;
  margin-top:3px;
}


/* DEDUCTIONS */
.amount{
  width:100%;
  padding:0 8px 8px;
}

.amount table{
  width:100%;
  min-width:0;
  max-width:100%;
  border-collapse:collapse;
}

.amount th{
  background:#08dada;
  padding:8px 4px;
  text-align:left;
}

.amount th:last-child{
  text-align:right;
}

.amount td{
  height:40px;
  border:1px solid #d9dfe2;
  padding:2px 4px;
}

.amount .deduct{
  width:100%;
  text-align:right;
  border:0;
  outline:0;
  background:transparent;
  font-size:16px;
}

.amountTotal{
  font-weight:700;
}


/* BUTTONS */
.actions{
  display:flex;
  gap:8px;
  padding:8px;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 12px;
  font-size:14px;
  font-weight:700;
}

.add{
  background:#08dada;
}

.clear{
  background:#e7eeee;
}


/* VERY SMALL PHONES */
@media(max-width:390px){

  .scroll > table th{
    font-size:9px;
  }

  .scroll > table input{
    font-size:12px;
  }

  .scroll > table .calc{
    font-size:12px;
  }

}
</style>

</style>
</head>


<body>

<div class="app">

  <div class="top">

    <h1>T-Post</h1>

    <span
      class="save"
      id="saveState">
      Saved
    </span>

  </div>


  <div class="card">


    <!-- =========================
         MAIN CALCULATOR TABLE
    ========================= -->

    <div class="scroll">

      <table>

        <thead>

          <tr>
            <th>Name</th>
            <th>Qty</th>
            <th>kg/bag</th>
            <th>Kilo</th>
            <th>Price</th>
            <th>Total Amount</th>
          </tr>

        </thead>


        <tbody id="rows"></tbody>

      </table>

    </div>


    <!-- =========================
         SUMMARY
    ========================= -->

    <div class="summary">

      <div class="box">

        <span>Σ kilo</span>

        <strong id="sumKilo">
          0
        </strong>

      </div>


      <div class="box">

        <span>Σ Total Amount</span>

        <strong id="sumAmount">
          0
        </strong>

      </div>

    </div>


    <!-- =========================
         AMOUNT / DEDUCTIONS
    ========================= -->

    <div class="amount">

      <table>

        <thead>

          <tr>
            <th>Amount</th>
            <th>Amount</th>
          </tr>

        </thead>


        <tbody id="deductions"></tbody>


        <tfoot>

          <tr>

            <td class="amountTotal">
              Amount total
            </td>

            <td
              class="calc amountTotal"
              id="amountTotal">
              0
            </td>

          </tr>

        </tfoot>

      </table>

    </div>


    <!-- =========================
         BUTTONS
    ========================= -->

    <div class="actions">

      <button
        class="add"
        id="add">
        ＋ Add row
      </button>


      <button
        class="clear"
        id="clear">
        Clear all
      </button>

    </div>


  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const rowsEl =
  document.querySelector('#rows');

const dedEl =
  document.querySelector('#deductions');

const KEY =
  'kgAmountPWA';


/* =========================
   BLANK ROW
========================= */

const blank = () => ({
  name:'',
  qty:'',
  kgBag:'',
  price:''
});


/* =========================
   NUMBER
========================= */

function num(v){

  return Number.parseFloat(v) || 0;

}


/* =========================
   FORMAT NUMBER
========================= */

function fmt(v){

  return Number.isInteger(v)
    ? String(v)
    : v.toFixed(2)
      .replace(/\.?0+$/,'');

}


/* =========================
   CREATE INPUT
========================= */

function input(
  cls,
  val,
  type='text',
  ph=''
){

  const e =
    document.createElement('input');

  e.className = cls;

  e.value = val || '';

  e.type = type;

  e.placeholder = ph;

  if(type === 'number'){

    e.step = 'any';

    e.inputMode = 'decimal';

  }

  return e;

}


/* =========================
   ADD MAIN ROW
========================= */

function addRow(d=blank()){

  const tr =
    document.createElement('tr');


  /* NAME */

  const name =
    input(
      '',
      d.name
    );


  /* QTY */

  const qty =
    input(
      'num',
      d.qty,
      'number'
    );


  /* KG/BAG */

  const kg =
    input(
      'num',
      d.kgBag,
      'number'
    );


  /* PRICE */

  const price =
    input(
      'num',
      d.price,
      'number'
    );


  /* KILO */

  const kilo =
    document.createElement('td');

  kilo.className =
    'calc kilo';


  /* TOTAL AMOUNT */

  const total =
    document.createElement('td');

  total.className =
    'calc total';


  const cells = [
    name,
    qty,
    kg,
    kilo,
    price,
    total
  ];


  cells.forEach((x,i)=>{

    let td;

    if(i===3 || i===5){

      td = x;

    }else{

      td =
        document.createElement('td');

      td.appendChild(x);

    }

    tr.appendChild(td);

  });


  /* AUTO CALCULATE */

  [
    name,
    qty,
    kg,
    price
  ].forEach(x=>{

    x.addEventListener(
      'input',
      calculate
    );

  });


  rowsEl.appendChild(tr);

}


/* =========================
   ADD DEDUCTION
========================= */

function addDeduction(v=''){

  const tr =
    document.createElement('tr');

  const a =
    document.createElement('td');

  const b =
    document.createElement('td');


  const x =
    input(
      'deduct',
      v,
      'number'
    );


  b.appendChild(x);

  tr.appendChild(a);

  tr.appendChild(b);


  x.addEventListener(
    'input',
    calculate
  );


  dedEl.appendChild(tr);

}


/* =========================
   CALCULATE
========================= */

function calculate(){

  let sk = 0;

  let sa = 0;


  [...rowsEl.rows].forEach(r=>{

    const q =
      num(
        r.cells[1]
         .firstChild.value
      );


    const kg =
      num(
        r.cells[2]
         .firstChild.value
      );


    const p =
      num(
        r.cells[4]
         .firstChild.value
      );


    /* QTY × KG/BAG */

    const k =
      q * kg;


    /* KILO × PRICE */

    const t =
      k * p;


    r.querySelector('.kilo')
     .textContent =
     fmt(k);


    r.querySelector('.total')
     .textContent =
     fmt(t);


    sk += k;

    sa += t;

  });


  /* =========================
     DEDUCTIONS
  ========================= */

  let d = 0;


  document
    .querySelectorAll('.deduct')
    .forEach(x=>{

      d += num(x.value);

    });


  /* =========================
     TOTALS
  ========================= */

  document
    .querySelector('#sumKilo')
    .textContent =
    fmt(sk);


  document
    .querySelector('#sumAmount')
    .textContent =
    fmt(sa);


  document
    .querySelector('#amountTotal')
    .textContent =
    fmt(sa-d);


  /* SAVE */

  save();


  document
    .querySelector('#saveState')
    .textContent =
    'Saved';

}


/* =========================
   SAVE
========================= */

function save(){

  const data = {

    rows:
      [...rowsEl.rows]
      .map(r=>({

        name:
          r.cells[0]
           .firstChild.value,

        qty:
          r.cells[1]
           .firstChild.value,

        kgBag:
          r.cells[2]
           .firstChild.value,

        price:
          r.cells[4]
           .firstChild.value

      })),

    ded:
      [
        ...document
          .querySelectorAll('.deduct')
      ].map(x=>x.value)

  };


  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


/* =========================
   LOAD
========================= */

function load(){

  try{

    const d =
      JSON.parse(
        localStorage.getItem(KEY)
      );


    if(d){

      (d.rows || [])
        .forEach(addRow);

      (d.ded || [])
        .forEach(addDeduction);

      return;

    }

  }catch(e){

    console.log(e);

  }


  /* DEFAULT 15 ROWS */

  for(let i=0;i<15;i++){

    addRow();

  }


  /* DEFAULT 13 DEDUCTIONS */

  for(let i=0;i<13;i++){

    addDeduction();

  }

}


/* =========================
   ADD ROW BUTTON
========================= */

document
  .querySelector('#add')
  .onclick = () => {

    addRow();

    calculate();

  };


/* =========================
   CLEAR ALL BUTTON
========================= */

document
  .querySelector('#clear')
  .onclick = () => {

    if(
      confirm(
        'Clear all entries?'
      )
    ){

      rowsEl.innerHTML = '';

      dedEl.innerHTML = '';


      for(let i=0;i<15;i++){

        addRow();

      }


      for(let i=0;i<13;i++){

        addDeduction();

      }


      calculate();

    }

  };


/* =========================
   START APP
========================= */

load();

calculate();


/* =========================
   SERVICE WORKER
========================= */

if(
  'serviceWorker' in navigator
){

  window.addEventListener(
    'load',
    () => {

      navigator.serviceWorker
        .register('sw.js');

    }
  );

}

</script>

</body>
</html>
