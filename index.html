<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#08dada">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="T-Post">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>T-Post</title>


<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  background:#f4f7f8;
  color:#172024;
  font-family:-apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Arial,
              sans-serif;
}

.app{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:4px;
}


/* =========================
   TOP
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:20px;
  line-height:1.2;
}

.save{
  font-size:11px;
  color:#667;
}


/* =========================
   CLIENT TABS
========================= */

.clientBar{
  display:flex;
  align-items:flex-end;
  gap:4px;

  width:100%;

  overflow-x:auto;
  overflow-y:hidden;

  padding:2px 0 5px;

  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.clientBar::-webkit-scrollbar{
  display:none;
}

.clientTab{
  flex:0 0 auto;

  border:0;
  border-radius:9px 9px 0 0;

  padding:8px 12px;

  background:#dfe8e9;
  color:#172024;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
}

.clientTab.active{
  background:#08dada;
}

.newClient{
  flex:0 0 auto;

  border:0;
  border-radius:9px;

  padding:8px 11px;

  background:#172024;
  color:#fff;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
}


/* =========================
   CARD
========================= */

.card{
  width:100%;
  max-width:100%;

  background:#fff;

  border-radius:0 14px 14px 14px;

  box-shadow:0 2px 10px #0001;

  overflow:hidden;
}


/* =========================
   TABLE
========================= */

.scroll{
  display:block;

  width:100%;
  max-width:100%;

  overflow:hidden;
}

.mainTable{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;

  border-collapse:collapse;

  table-layout:fixed;
}


/*
   DEFAULT WIDTHS

   Name          25%
   Qty           12%
   kg/bag         9%
   Kilo          15%
   Price         12%
   Total Amount  27%

   TOTAL = 100%
*/

.mainTable th,
.mainTable td{
  min-width:0;
  max-width:100%;
}


/* =========================
   HEADER
========================= */

.mainTable th{
  position:relative;

  background:#08dada;

  padding:8px 2px;

  text-align:center;

  font-size:12px;
  line-height:1.05;

  white-space:normal;

  overflow-wrap:anywhere;
  word-break:break-word;

  overflow:hidden;
}


/* =========================
   CELLS
========================= */

.mainTable td{
  border:1px solid #d9dfe2;

  height:43px;

  padding:1px;

  overflow:hidden;
}


/* =========================
   INPUTS
========================= */

.mainTable input{
  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  height:39px;

  border:0;
  outline:0;

  background:transparent;

  padding:3px 2px;

  font-size:15px;

  color:#172024;
}

.mainTable input.num{
  text-align:center;
}


/* =========================
   CALCULATED CELLS
========================= */

.mainTable .calc{
  text-align:center;

  padding:3px 1px;

  font-size:13px;

  font-variant-numeric:tabular-nums;

  background:#f8fafb;

  white-space:nowrap;

  overflow:hidden;
}


/* =========================
   DRAGGABLE DIVIDERS
========================= */

/*
   Each divider has a large invisible
   touch area, making it easier to
   drag on an iPhone.
*/

.resizeHandle{
  position:absolute;

  top:0;
  right:-9px;

  width:18px;
  height:100%;

  z-index:100;

  cursor:col-resize;

  touch-action:none;
}

.resizeHandle::before{
  content:"";

  position:absolute;

  top:0;
  right:7px;

  width:3px;
  height:100%;

  background:#17202455;

  border-radius:3px;
}

.resizeHandle::after{
  content:"";

  position:absolute;

  top:35%;
  right:3px;

  width:11px;
  height:30%;

  border-left:2px solid #17202488;
  border-right:2px solid #17202488;

  border-radius:2px;
}

body.resizing{
  user-select:none;
  -webkit-user-select:none;

  cursor:col-resize;
}


/* =========================
   SUMMARY
========================= */

.summary{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:6px;

  padding:7px;
}

.box{
  background:#08dada;

  border-radius:8px;

  padding:7px 9px;

  min-width:0;
}

.box span{
  font-size:12px;
}

.box strong{
  display:block;

  text-align:right;

  font-size:17px;

  margin-top:3px;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================
   DEDUCTIONS
========================= */

.amount{
  width:100%;
  max-width:100%;

  padding:0 7px 7px;

  overflow:hidden;
}

.amount table{
  width:100%;
  max-width:100%;
  min-width:0;

  border-collapse:collapse;

  table-layout:fixed;
}

.amount th{
  background:#08dada;

  padding:8px 4px;

  text-align:left;

  font-size:12px;
}

.amount th:last-child{
  text-align:right;
}

.amount td{
  height:40px;

  border:1px solid #d9dfe2;

  padding:2px 4px;
}

.amount .deduct{
  display:block;

  width:100%;
  max-width:100%;

  text-align:right;

  border:0;
  outline:0;

  background:transparent;

  font-size:15px;
}

.amountTotal{
  font-weight:700;
}


/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;

  flex-wrap:nowrap;

  gap:4px;

  width:100%;
  max-width:100%;

  padding:7px;

  overflow:hidden;
}

.actions button{
  flex:1 1 0;

  min-width:0;

  border:0;

  border-radius:9px;

  padding:10px 2px;

  font-size:11px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;
}

.add{
  background:#08dada;
}

.remove{
  background:#ffdede;
}

.saveBtn{
  background:#dffafa;
}

.png{
  background:#dffafa;
}

.clear{
  background:#e7eeee;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .app{
    padding:3px;
  }

  .top{
    margin-bottom:4px;
  }

  h1{
    font-size:18px;
  }

  .save{
    display:none;
  }


  /* CLIENT TABS */

  .clientTab,
  .newClient{
    font-size:11px;

    padding:8px 9px;
  }


  /* TABLE */

  .scroll{
    width:100%;
    max-width:100%;
    overflow:hidden;
  }

  .mainTable{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;

    table-layout:fixed;
  }


  /* HEADER */

  .mainTable th{
    font-size:9px;

    line-height:1.05;

    padding:7px 1px;

    white-space:normal;

    overflow-wrap:anywhere;
    word-break:break-word;
  }


  /* CELLS */

  .mainTable td{
    height:43px;

    padding:1px;
  }


  /* INPUT */

  .mainTable input{
    width:100%;
    max-width:100%;
    min-width:0;

    height:39px;

    padding:3px 1px;

    font-size:12px;
  }

  .mainTable input.num{
    text-align:center;
  }

  .mainTable .calc{
    font-size:11px;

    padding:3px 1px;
  }


  /* SUMMARY */

  .summary{
    grid-template-columns:1fr 1fr;

    gap:5px;

    padding:6px;
  }

  .box{
    padding:6px 7px;
  }

  .box span{
    font-size:10px;
  }

  .box strong{
    font-size:15px;
  }


  /* AMOUNT */

  .amount{
    padding:0 6px 6px;
  }


  /* BUTTONS */

  .actions{
    gap:3px;

    padding:6px;
  }

  .actions button{
    padding:10px 1px;

    font-size:9px;

    border-radius:8px;
  }

}


/* =========================
   VERY SMALL IPHONE
========================= */

@media(max-width:390px){

  h1{
    font-size:17px;
  }

  .mainTable th{
    font-size:8px;
  }

  .mainTable input{
    font-size:11px;
  }

  .mainTable .calc{
    font-size:10px;
  }

  .actions{
    gap:2px;
  }

  .actions button{
    padding:9px 1px;

    font-size:8px;
  }

}

</style>

</head>


<body>

<div class="app">


  <!-- TOP -->

  <div class="top">

    <h1>T-Post</h1>

    <span
      class="save"
      id="saveState">
      Saved
    </span>

  </div>


  <!-- CLIENT TABS -->

  <div
    class="clientBar"
    id="clientBar">
  </div>


  <!-- CARD -->

  <div class="card">


    <!-- MAIN TABLE -->

    <div class="scroll">

      <table
        class="mainTable"
        id="mainTable">

        <colgroup>

          <col>
          <col>
          <col>
          <col>
          <col>
          <col>

        </colgroup>


        <thead>

          <tr>

            <th data-col="0">

              Name

              <span
                class="resizeHandle"
                data-col="0">
              </span>

            </th>


            <th data-col="1">

              Qty

              <span
                class="resizeHandle"
                data-col="1">
              </span>

            </th>


            <th data-col="2">

              kg/bag

              <span
                class="resizeHandle"
                data-col="2">
              </span>

            </th>


            <th data-col="3">

              Kilo

              <span
                class="resizeHandle"
                data-col="3">
              </span>

            </th>


            <th data-col="4">

              Price

              <span
                class="resizeHandle"
                data-col="4">
              </span>

            </th>


            <th data-col="5">

              Total Amount

            </th>

          </tr>

        </thead>


        <tbody id="rows">
        </tbody>

      </table>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

      <div class="box">

        <span>
          Σ kilo
        </span>

        <strong id="sumKilo">
          0
        </strong>

      </div>


      <div class="box">

        <span>
          Σ Total Amount
        </span>

        <strong id="sumAmount">
          0
        </strong>

      </div>

    </div>


    <!-- DEDUCTIONS -->

    <div class="amount">

      <table>

        <thead>

          <tr>

            <th>
              Amount
            </th>

            <th>
              Amount
            </th>

          </tr>

        </thead>


        <tbody id="deductions">
        </tbody>


        <tfoot>

          <tr>

            <td class="amountTotal">
              Amount total
            </td>

            <td
              class="calc amountTotal"
              id="amountTotal">
              0
            </td>

          </tr>

        </tfoot>

      </table>

    </div>


    <!-- BUTTONS -->

    <div class="actions">

      <button
        class="add"
        id="add">
        ＋ Add
      </button>


      <button
        class="remove"
        id="remove">
        − Remove
      </button>


      <button
        class="saveBtn"
        id="saveToday">
        💾 Save
      </button>


      <button
        class="png"
        id="savePNG">
        📷 PNG
      </button>


      <button
        class="clear"
        id="clear">
        Clear
      </button>

    </div>


  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const rowsEl =
  document.querySelector('#rows');

const dedEl =
  document.querySelector('#deductions');

const clientBar =
  document.querySelector('#clientBar');

const saveState =
  document.querySelector('#saveState');

const mainTable =
  document.querySelector('#mainTable');

const colElements =
  mainTable.querySelectorAll('col');


/* =========================
   STORAGE
========================= */

const CLIENT_KEY =
  'TPOST_CLIENTS_V6';

const WIDTH_KEY =
  'TPOST_WIDTHS_V1';


let clients = {};

let currentClient = null;


/* =========================
   DEFAULT COLUMN WIDTHS
========================= */

let columnWidths = [

  25,  // Name
  12,  // Qty
  9,   // kg/bag
  15,  // Kilo
  12,  // Price
  27   // Total Amount

];


/* =========================
   LOAD COLUMN WIDTHS
========================= */

function loadWidths(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          WIDTH_KEY
        )
      );

    if(
      Array.isArray(saved) &&
      saved.length === 6
    ){

      const total =
        saved.reduce(
          (a,b)=>a+Number(b),
          0
        );

      if(
        Math.abs(total - 100) < 0.5
      ){

        columnWidths =
          saved.map(Number);

      }

    }

  }catch(error){}

}


/* =========================
   APPLY COLUMN WIDTHS
========================= */

function applyWidths(){

  columnWidths.forEach(
    (width,index)=>{

      colElements[index]
        .style.width =
        width + '%';

    }
  );

}


/* =========================
   SAVE WIDTHS
========================= */

function saveWidths(){

  localStorage.setItem(
    WIDTH_KEY,
    JSON.stringify(
      columnWidths
    )
  );

}


/* =========================
   RESET WIDTHS
========================= */

function resetWidths(){

  columnWidths = [

    25,
    12,
    9,
    15,
    12,
    27

  ];

  applyWidths();

  saveWidths();

}


/* =========================
   BLANK ROW
========================= */

function blank(){

  return {

    name:'',
    qty:'',
    kgBag:'',
    price:''

  };

}


/* =========================
   NUMBER
========================= */

function num(v){

  return Number.parseFloat(v) || 0;

}


/* =========================
   FORMAT
========================= */

function fmt(v){

  if(Number.isInteger(v)){

    return String(v);

  }

  return v
    .toFixed(2)
    .replace(/\.?0+$/,'');

}


/* =========================
   INPUT
========================= */

function makeInput(
  cls,
  value,
  type='text'
){

  const e =
    document.createElement('input');

  e.className =
    cls;

  e.value =
    value || '';

  e.type =
    type;

  if(type === 'number'){

    e.step =
      'any';

    e.inputMode =
      'decimal';

  }

  return e;

}


/* =========================
   ADD ROW
========================= */

function addRow(data=blank()){

  const tr =
    document.createElement('tr');


  const name =
    makeInput(
      '',
      data.name
    );


  const qty =
    makeInput(
      'num',
      data.qty,
      'number'
    );


  const kg =
    makeInput(
      'num',
      data.kgBag,
      'number'
    );


  const price =
    makeInput(
      'num',
      data.price,
      'number'
    );


  const kilo =
    document.createElement('td');

  kilo.className =
    'calc kilo';


  const total =
    document.createElement('td');

  total.className =
    'calc total';


  const cells = [

    name,
    qty,
    kg,
    kilo,
    price,
    total

  ];


  cells.forEach((x,i)=>{

    let td;


    if(
      i === 3 ||
      i === 5
    ){

      td = x;

    }else{

      td =
        document.createElement('td');

      td.appendChild(x);

    }


    tr.appendChild(td);

  });


  [
    name,
    qty,
    kg,
    price
  ].forEach(inputEl=>{

    inputEl.addEventListener(
      'input',
      ()=>{

        calculate();

        autoSave();

      }
    );

  });


  rowsEl.appendChild(tr);

}


/* =========================
   ADD DEDUCTION
========================= */

function addDeduction(value=''){

  const tr =
    document.createElement('tr');


  const a =
    document.createElement('td');

  const b =
    document.createElement('td');


  const x =
    makeInput(
      'deduct',
      value,
      'number'
    );


  b.appendChild(x);


  tr.appendChild(a);
  tr.appendChild(b);


  x.addEventListener(
    'input',
    ()=>{

      calculate();

      autoSave();

    }
  );


  dedEl.appendChild(tr);

}


/* =========================
   GET DATA
========================= */

function getData(){

  return {

    rows:
      [...rowsEl.rows]
      .map(r=>({

        name:
          r.cells[0]
           .firstChild.value,

        qty:
          r.cells[1]
           .firstChild.value,

        kgBag:
          r.cells[2]
           .firstChild.value,

        price:
          r.cells[4]
           .firstChild.value

      })),

    ded:
      [...document
        .querySelectorAll('.deduct')]
      .map(x=>x.value)

  };

}


/* =========================
   AUTO SAVE
========================= */

function autoSave(){

  if(!currentClient){

    return;

  }


  clients[currentClient] =
    getData();


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  saveState.textContent =
    'Saved';

}


/* =========================
   LOAD CLIENTS
========================= */

function loadClients(){

  try{

    clients =
      JSON.parse(
        localStorage.getItem(
          CLIENT_KEY
        )
      ) || {};

  }catch(error){

    clients = {};

  }


  const names =
    Object.keys(clients);


  if(names.length === 0){

    currentClient =
      'Client 1';


    clients[currentClient] = {

      rows:[],
      ded:[]

    };

  }else{

    currentClient =
      names[0];

  }


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );

}


/* =========================
   RENDER CLIENT TABS
========================= */

function renderTabs(){

  clientBar.innerHTML =
    '';


  Object.keys(clients)
    .forEach(name=>{

      const button =
        document.createElement('button');


      button.className =
        'clientTab';


      if(
        name === currentClient
      ){

        button.classList.add(
          'active'
        );

      }


      button.textContent =
        name;


      button.onclick =
        ()=>{
          switchClient(name);
        };


      button.ondblclick =
        ()=>{
          deleteClient(name);
        };


      clientBar.appendChild(
        button
      );

    });


  const newButton =
    document.createElement('button');


  newButton.className =
    'newClient';


  newButton.textContent =
    '＋ New';


  newButton.onclick =
    createClient;


  clientBar.appendChild(
    newButton
  );

}


/* =========================
   LOAD CLIENT
========================= */

function loadClient(){

  rowsEl.innerHTML =
    '';

  dedEl.innerHTML =
    '';


  const data =
    clients[currentClient] || {

      rows:[],
      ded:[]

    };


  (data.rows || [])
    .forEach(addRow);


  /*
     START WITH 10 ROWS.
     MORE CAN BE ADDED.
  */

  while(
    rowsEl.children.length < 10
  ){

    addRow();

  }


  (data.ded || [])
    .forEach(addDeduction);


  while(
    dedEl.children.length < 13
  ){

    addDeduction();

  }


  calculate();

}


/* =========================
   SWITCH CLIENT
========================= */

function switchClient(name){

  autoSave();

  currentClient =
    name;

  loadClient();

  renderTabs();

}


/* =========================
   NEW CLIENT
========================= */

function createClient(){

  const name =
    prompt(
      'Enter client name:'
    );


  if(name === null){

    return;

  }


  const cleanName =
    name.trim();


  if(!cleanName){

    alert(
      'Please enter a client name.'
    );

    return;

  }


  if(clients[cleanName]){

    alert(
      'That client already exists.'
    );

    return;

  }


  autoSave();


  clients[cleanName] = {

    rows:[],
    ded:[]

  };


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  currentClient =
    cleanName;


  loadClient();

  renderTabs();


  saveState.textContent =
    'Saved';

}


/* =========================
   DELETE CLIENT
========================= */

function deleteClient(name){

  if(
    !confirm(
      'Delete "' +
      name +
      '" and all its data?'
    )
  ){

    return;

  }


  delete clients[name];


  let names =
    Object.keys(clients);


  if(names.length === 0){

    currentClient =
      'Client 1';


    clients[currentClient] = {

      rows:[],
      ded:[]

    };

  }else if(
    currentClient === name
  ){

    currentClient =
      names[0];

  }


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  loadClient();

  renderTabs();

}


/* =========================
   CALCULATE
========================= */

function calculate(){

  let totalKilo = 0;

  let totalAmount = 0;


  [...rowsEl.rows]
    .forEach(row=>{

      const qty =
        num(
          row.cells[1]
             .firstChild.value
        );


      const kgBag =
        num(
          row.cells[2]
             .firstChild.value
        );


      const price =
        num(
          row.cells[4]
             .firstChild.value
        );


      const kilo =
        qty * kgBag;


      const amount =
        kilo * price;


      row.querySelector(
        '.kilo'
      ).textContent =
        fmt(kilo);


      row.querySelector(
        '.total'
      ).textContent =
        fmt(amount);


      totalKilo +=
        kilo;


      totalAmount +=
        amount;

    });


  let deductions = 0;


  document
    .querySelectorAll('.deduct')
    .forEach(inputEl=>{

      deductions +=
        num(inputEl.value);

    });


  document.querySelector(
    '#sumKilo'
  ).textContent =
    fmt(totalKilo);


  document.querySelector(
    '#sumAmount'
  ).textContent =
    fmt(totalAmount);


  document.querySelector(
    '#amountTotal'
  ).textContent =
    fmt(
      totalAmount -
      deductions
    );

}

/* =========================
   SAVE BUTTON
========================= */

document
  .querySelector('#saveToday')
  .onclick = ()=>{

    const name =
      prompt(
        'Enter a name for this saved calculation:'
      );


    if(name === null){

      return;

    }


    const cleanName =
      name.trim();


    if(!cleanName){

      alert(
        'Please enter a name.'
      );

      return;

    }


    /*
       Save this calculation
       to the current phone.
    */

    let snapshots = {};


    try{

      snapshots =
        JSON.parse(
          localStorage.getItem(
            'TPOST_SNAPSHOTS_V1'
          )
        ) || {};

    }catch(error){

      snapshots = {};

    }


    snapshots[cleanName] =
      getData();


    localStorage.setItem(
      'TPOST_SNAPSHOTS_V1',
      JSON.stringify(
        snapshots
      )
    );


    autoSave();


    saveState.textContent =
      'Saved: ' + cleanName;


    alert(
      'Saved as "' +
      cleanName +
      '"'
    );

  };

/* =========================
   DRAGGABLE COLUMNS
========================= */

let resizing = false;

let resizeColumn = 0;

let startX = 0;

let startWidths = [];


/*
   Minimum column widths.
*/

const minWidths = [

  15, // Name
  8,  // Qty
  7,  // kg/bag
  10, // Kilo
  8,  // Price
  15  // Total

];


/* =========================
   START DRAG
========================= */

function startResize(e){

  e.preventDefault();

  e.stopPropagation();


  resizing = true;


  resizeColumn =
    Number(
      e.currentTarget.dataset.col
    );


  if(e.touches){

    startX =
      e.touches[0].clientX;

  }else{

    startX =
      e.clientX;

  }


  startWidths =
    [...columnWidths];


  document.body.classList.add(
    'resizing'
  );

}


/* =========================
   MOVE DIVIDER
========================= */

function moveResize(e){

  if(!resizing){

    return;

  }


  e.preventDefault();


  let currentX;


  if(e.touches){

    currentX =
      e.touches[0].clientX;

  }else{

    currentX =
      e.clientX;

  }


  const tableWidth =
    mainTable.getBoundingClientRect()
      .width;


  const change =
    ((currentX - startX) /
      tableWidth) * 100;


  const left =
    resizeColumn;


  const right =
    resizeColumn + 1;


  if(right >= 6){

    return;

  }


  let leftWidth =
    startWidths[left] +
    change;


  let rightWidth =
    startWidths[right] -
    change;


  /*
     Minimum widths.
  */

  if(
    leftWidth <
    minWidths[left]
  ){

    leftWidth =
      minWidths[left];

    rightWidth =
      startWidths[left] +
      startWidths[right] -
      leftWidth;

  }


  if(
    rightWidth <
    minWidths[right]
  ){

    rightWidth =
      minWidths[right];

    leftWidth =
      startWidths[left] +
      startWidths[right] -
      rightWidth;

  }


  columnWidths[left] =
    leftWidth;


  columnWidths[right] =
    rightWidth;


  applyWidths();

}


/* =========================
   END DRAG
========================= */

function stopResize(){

  if(!resizing){

    return;

  }


  resizing = false;


  document.body.classList.remove(
    'resizing'
  );


  saveWidths();

}


/* =========================
   TOUCH EVENTS
========================= */

document
  .querySelectorAll('.resizeHandle')
  .forEach(handle=>{

    handle.addEventListener(
      'touchstart',
      startResize,
      {passive:false}
    );


    handle.addEventListener(
      'mousedown',
      startResize
    );

  });


document.addEventListener(
  'touchmove',
  moveResize,
  {passive:false}
);


document.addEventListener(
  'mousemove',
  moveResize
);


document.addEventListener(
  'touchend',
  stopResize
);


document.addEventListener(
  'mouseup',
  stopResize
);
