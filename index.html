<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#08dada">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KG Amount">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>T-Post</title>

<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
}

body{
  background:#f4f7f8;
  color:#172024;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.app{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:8px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

h1{
  font-size:21px;
  margin:0;
}

.save{
  font-size:12px;
  color:#667;
}


/* =========================
   CARD
========================= */

.card{
  width:100%;
  background:#fff;
  border-radius:14px;
  box-shadow:0 2px 10px #0001;
  overflow:hidden;
}


/* =========================
   MAIN TABLE
========================= */

.scroll{
  width:100%;
  overflow-x:hidden;
}

.mainTable{
  width:100%;
  max-width:100%;
  min-width:0;
  border-collapse:collapse;
  table-layout:fixed;
}

/* EXACT COLUMN WIDTHS
   25 + 12 + 9 + 15 + 12 + 27 = 100%
*/

.mainTable col:nth-child(1){
  width:25%;
}

.mainTable col:nth-child(2){
  width:12%;
}

.mainTable col:nth-child(3){
  width:9%;
}

.mainTable col:nth-child(4){
  width:15%;
}

.mainTable col:nth-child(5){
  width:12%;
}

.mainTable col:nth-child(6){
  width:27%;
}


.mainTable th{
  background:#08dada;
  padding:10px 3px;
  text-align:center;
  font-size:14px;
  line-height:1.1;
  white-space:normal;
  overflow-wrap:anywhere;
}

.mainTable td{
  border:1px solid #d9dfe2;
  height:43px;
  padding:1px 3px;
  overflow:hidden;
}

.mainTable input{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  height:38px;
  border:0;
  outline:0;
  background:transparent;
  padding:4px 2px;
  font-size:16px;
}

.mainTable input.num{
  text-align:right;
}

.mainTable .calc{
  text-align:right;
  padding:5px 3px;
  font-variant-numeric:tabular-nums;
  background:#f8fafb;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   SUMMARY
========================= */

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:8px;
}

.box{
  background:#08dada;
  border-radius:8px;
  padding:8px 10px;
}

.box span{
  font-size:13px;
}

.box strong{
  display:block;
  text-align:right;
  font-size:18px;
  margin-top:3px;
}


/* =========================
   AMOUNT / DEDUCTIONS
========================= */

.amount{
  width:100%;
  padding:0 8px 8px;
}

.amount table{
  width:100%;
  min-width:0;
  max-width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

.amount th{
  background:#08dada;
  padding:8px 4px;
  text-align:left;
}

.amount th:last-child{
  text-align:right;
}

.amount td{
  height:40px;
  border:1px solid #d9dfe2;
  padding:2px 4px;
}

.amount .deduct{
  display:block;
  width:100%;
  text-align:right;
  border:0;
  outline:0;
  background:transparent;
  font-size:16px;
}

.amountTotal{
  font-weight:700;
}


/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;
  gap:8px;
  padding:8px;
  padding-bottom:12px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.add{
  background:#08dada;
}

.clear{
  background:#e7eeee;
}


/* =========================
   IPHONE
========================= */

@media(max-width:400px){

  .app{
    padding:4px;
  }

  .top{
    margin-bottom:6px;
  }

  h1{
    font-size:18px;
  }

  .save{
    display:none;
  }

  /* KEEP ALL 6 COLUMNS ON SCREEN */
  .mainTable{
    width:100%;
    min-width:0;
    table-layout:fixed;
  }

  .mainTable th{
    font-size:10px;
    padding:8px 1px;
  }

  .mainTable td{
    height:43px;
    padding:1px;
  }

  .mainTable input{
    height:38px;
    padding:4px 1px;
    font-size:13px;
  }

  .mainTable input.num{
    text-align:center;
  }

  .mainTable .calc{
    padding:4px 1px;
    font-size:12px;
    text-align:center;
  }

  .summary{
    grid-template-columns:1fr 1fr;
    gap:6px;
    padding:7px;
  }

  .box{
    padding:7px 8px;
  }

  .box span{
    font-size:12px;
  }

  .box strong{
    font-size:16px;
  }

  .amount{
    padding:0 7px 7px;
  }

  .amount th{
    font-size:13px;
    padding:7px 3px;
  }

  .amount td{
    height:38px;
  }

  .amount .deduct{
    font-size:14px;
  }

  /* BUTTONS ALWAYS VISIBLE AFTER 10 ROWS */
  .actions{
    display:flex;
    width:100%;
    padding:8px;
    padding-bottom:12px;
  }

  button{
    flex:1;
    padding:11px 8px;
    font-size:14px;
  }
}


/* =========================
   VERY SMALL IPHONES
========================= */

@media(max-width:390px){

  .mainTable th{
    font-size:9px;
  }

  .mainTable input{
    font-size:12px;
  }

  .mainTable .calc{
    font-size:11px;
  }

  button{
    font-size:13px;
  }

}

</style>
</head>


<body>

<div class="app">

  <!-- TITLE -->
  <div class="top">

    <h1>KG & Amount Calculator</h1>

    <span
      class="save"
      id="saveState">
      Saved
    </span>

  </div>


  <div class="card">

    <!-- =====================
         MAIN CALCULATOR
    ====================== -->

    <div class="scroll">

      <table class="mainTable">

        <!-- COLUMN WIDTHS -->
        <colgroup>
          <col style="width:25%">
          <col style="width:12%">
          <col style="width:9%">
          <col style="width:15%">
          <col style="width:12%">
          <col style="width:27%">
        </colgroup>

        <thead>

          <tr>
            <th>Name</th>
            <th>Qty</th>
            <th>kg/bag</th>
            <th>Kilo</th>
            <th>Price</th>
            <th>Total Amount</th>
          </tr>

        </thead>

        <tbody id="rows"></tbody>

      </table>

    </div>


    <!-- =====================
         SUMMARY
    ====================== -->

    <div class="summary">

      <div class="box">

        <span>Σ kilo</span>

        <strong id="sumKilo">
          0
        </strong>

      </div>


      <div class="box">

        <span>Σ Total Amount</span>

        <strong id="sumAmount">
          0
        </strong>

      </div>

    </div>


    <!-- =====================
         DEDUCTIONS
    ====================== -->

    <div class="amount">

      <table>

        <thead>

          <tr>
            <th>Amount</th>
            <th>Amount</th>
          </tr>

        </thead>

        <tbody id="deductions"></tbody>

        <tfoot>

          <tr>

            <td class="amountTotal">
              Amount total
            </td>

            <td
              class="calc amountTotal"
              id="amountTotal">
              0
            </td>

          </tr>

        </tfoot>

      </table>

    </div>


    <!-- =====================
         BUTTONS
    ====================== -->

    <div class="actions">

      <button
        class="add"
        id="add">
        ＋ Add row
      </button>

      <button
        class="clear"
        id="clear">
        Clear all
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const rowsEl =
  document.querySelector('#rows');

const dedEl =
  document.querySelector('#deductions');

const KEY =
  'kgAmountPWA';


/* =========================
   BLANK DATA
========================= */

const blank = () => ({
  name:'',
  qty:'',
  kgBag:'',
  price:''
});


/* =========================
   NUMBER
========================= */

function num(v){

  return Number.parseFloat(v) || 0;

}


/* =========================
   FORMAT NUMBER
========================= */

function fmt(v){

  return Number.isInteger(v)
    ? String(v)
    : v.toFixed(2)
      .replace(/\.?0+$/,'');

}


/* =========================
   CREATE INPUT
========================= */

function input(
  cls,
  val,
  type='text',
  ph=''
){

  const e =
    document.createElement('input');

  e.className = cls;

  e.value = val || '';

  e.type = type;

  e.placeholder = ph;

  if(type === 'number'){
    e.step = 'any';
    e.inputMode = 'decimal';
  }

  return e;

}


/* =========================
   ADD ROW
========================= */

function addRow(d=blank()){

  const tr =
    document.createElement('tr');


  /* NAME */

  const name =
    input('',d.name);


  /* QTY */

  const qty =
    input(
      'num',
      d.qty,
      'number'
    );


  /* KG/BAG */

  const kg =
    input(
      'num',
      d.kgBag,
      'number'
    );


  /* PRICE */

  const price =
    input(
      'num',
      d.price,
      'number'
    );


  /* KILO */

  const kilo =
    document.createElement('td');

  kilo.className =
    'calc kilo';


  /* TOTAL AMOUNT */

  const total =
    document.createElement('td');

  total.className =
    'calc total';


  /* CREATE CELLS */

  const cells = [
    name,
    qty,
    kg,
    kilo,
    price,
    total
  ];


  cells.forEach((x,i)=>{

    let td;

    /* KILO AND TOTAL ARE ALREADY TD */

    if(i === 3 || i === 5){

      td = x;

    }else{

      td =
        document.createElement('td');

      td.appendChild(x);

    }

    tr.appendChild(td);

  });


  /* CALCULATE WHEN TYPING */

  [
    name,
    qty,
    kg,
    price
  ].forEach(x=>{

    x.addEventListener(
      'input',
      calculate
    );

  });


  rowsEl.appendChild(tr);

}


/* =========================
   ADD DEDUCTION
========================= */

function addDeduction(v=''){

  const tr =
    document.createElement('tr');


  const a =
    document.createElement('td');


  const b =
    document.createElement('td');


  const x =
    input(
      'deduct',
      v,
      'number'
    );


  b.appendChild(x);

  tr.appendChild(a);
  tr.appendChild(b);


  x.addEventListener(
    'input',
    calculate
  );


  dedEl.appendChild(tr);

}


/* =========================
   CALCULATE
========================= */

function calculate(){

  let sk = 0;
  let sa = 0;


  [...rowsEl.rows].forEach(r=>{

    const q =
      num(
        r.cells[1]
         .firstChild.value
      );


    const kg =
      num(
        r.cells[2]
         .firstChild.value
      );


    const p =
      num(
        r.cells[4]
         .firstChild.value
      );


    /* KILO = QTY × KG/BAG */

    const k =
      q * kg;


    /* TOTAL = KILO × PRICE */

    const t =
      k * p;


    r.querySelector('.kilo')
      .textContent = fmt(k);


    r.querySelector('.total')
      .textContent = fmt(t);


    sk += k;
    sa += t;

  });


  /* DEDUCTIONS */

  let d = 0;


  document
    .querySelectorAll('.deduct')
    .forEach(x=>{

      d += num(x.value);

    });


  /* SUMMARY */

  document.querySelector(
    '#sumKilo'
  ).textContent = fmt(sk);


  document.querySelector(
    '#sumAmount'
  ).textContent = fmt(sa);


  /* FINAL AMOUNT */

  document.querySelector(
    '#amountTotal'
  ).textContent = fmt(sa - d);


  save();

  document.querySelector(
    '#saveState'
  ).textContent = 'Saved';

}


/* =========================
   SAVE
========================= */

function save(){

  const data = {

    rows:
      [...rowsEl.rows].map(r=>({

        name:
          r.cells[0]
           .firstChild.value,

        qty:
          r.cells[1]
           .firstChild.value,

        kgBag:
          r.cells[2]
           .firstChild.value,

        price:
          r.cells[4]
           .firstChild.value

      })),

    ded:
      [
        ...document
          .querySelectorAll('.deduct')
      ].map(x=>x.value)

  };


  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


/* =========================
   LOAD
========================= */

function load(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(KEY)
      );


    if(saved){

      (saved.rows || [])
        .forEach(addRow);


      (saved.ded || [])
        .forEach(addDeduction);


      /* If saved file has no rows,
         create 10 */

      if(!saved.rows ||
         saved.rows.length === 0){

        for(
          let i=0;
          i<10;
          i++
        ){
          addRow();
        }

      }

      return;

    }

  }catch(e){}


  /* =====================
     START WITH 10 ROWS
  ===================== */

  for(
    let i=0;
    i<10;
    i++
  ){

    addRow();

  }


  /* =====================
     DEDUCTION ROWS
  ===================== */

  for(
    let i=0;
    i<13;
    i++
  ){

    addDeduction();

  }

}


/* =========================
   ADD ROW BUTTON
========================= */

document
  .querySelector('#add')
  .onclick = () => {

    addRow();

    calculate();

    /* Scroll to the new row */

    setTimeout(()=>{

      const lastRow =
        rowsEl.lastElementChild;

      if(lastRow){

        lastRow.scrollIntoView({
          behavior:'smooth',
          block:'center'
        });

      }

    },100);

  };


/* =========================
   CLEAR ALL
========================= */

document
  .querySelector('#clear')
  .onclick = () => {

    if(
      confirm(
        'Clear all entries?'
      )
    ){

      rowsEl.innerHTML = '';

      dedEl.innerHTML = '';


      /* BACK TO 10 ROWS */

      for(
        let i=0;
        i<10;
        i++
      ){

        addRow();

      }


      /* DEDUCTIONS */

      for(
        let i=0;
        i<13;
        i++
      ){

        addDeduction();

      }


      calculate();

    }

  };


/* =========================
   START APP
========================= */

load();

calculate();


/* =========================
   SERVICE WORKER
========================= */

if(
  'serviceWorker' in navigator
){

  window.addEventListener(
    'load',
    ()=>{
      navigator.serviceWorker.register(
        'sw.js'
      );
    }
  );

}

</script>

</body>
</html>
