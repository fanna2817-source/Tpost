<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#08dada">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="T-Post">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>T-Post</title>

<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  background:#f4f7f8;
  color:#172024;
  font-family:-apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Arial,
  sans-serif;
}

.app{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:4px;
}


/* =========================
   TOP
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  margin-bottom:5px;
}

h1{
  margin:0;
  font-size:20px;
  line-height:1.2;
}

.save{
  font-size:11px;
  color:#667;
}


/* =========================
   CLIENT BAR
========================= */

.clientBar{
  display:flex;
  align-items:flex-end;
  gap:4px;
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  padding:2px 0 5px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.clientBar::-webkit-scrollbar{
  display:none;
}


/* =========================
   CLIENT TAB
========================= */

.clientTab{
  display:flex;
  align-items:center;
  gap:2px;

  flex:0 0 auto;

  border:0;
  border-radius:9px 9px 0 0;

  padding:0;

  background:#dfe8e9;
  color:#172024;

  font-size:11px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
}

.clientTab.active{
  background:#08dada;
}


/* CLIENT NAME */

.clientName{
  border:0;
  background:transparent;
  color:inherit;

  padding:8px 5px 8px 10px;

  font-size:11px;
  font-weight:700;

  white-space:nowrap;
}


/* DELETE X */

.deleteClient{
  border:0;
  background:transparent;
  color:#555;

  font-size:18px;
  font-weight:700;

  line-height:1;

  padding:5px 8px 5px 2px;
}

.deleteClient:active{
  transform:scale(.9);
}


/* NEW CLIENT */

.newClient{
  flex:0 0 auto;

  border:0;
  border-radius:9px;

  padding:8px 11px;

  background:#172024;
  color:#fff;

  font-size:11px;
  font-weight:700;

  white-space:nowrap;
}


/* =========================
   CARD
========================= */

.card{
  width:100%;
  max-width:100%;

  background:#fff;

  border-radius:0 14px 14px 14px;

  box-shadow:0 2px 10px #0001;

  overflow:hidden;
}


/* =========================
   MAIN TABLE
========================= */

.scroll{
  width:100%;
  max-width:100%;
  overflow:hidden;
}

.mainTable{
  width:100%;
  max-width:100%;
  min-width:0;

  border-collapse:collapse;
  table-layout:fixed;
}


/* =========================
   COLUMN WIDTHS
========================= */

/*
Name          25%
Qty           12%
kg/bag         9%
Kilo          15%
Price         12%
Total Amount  27%

TOTAL = 100%
*/

.mainTable th:nth-child(1),
.mainTable td:nth-child(1){
  width:25%;
}

.mainTable th:nth-child(2),
.mainTable td:nth-child(2){
  width:12%;
}

.mainTable th:nth-child(3),
.mainTable td:nth-child(3){
  width:9%;
}

.mainTable th:nth-child(4),
.mainTable td:nth-child(4){
  width:15%;
}

.mainTable th:nth-child(5),
.mainTable td:nth-child(5){
  width:12%;
}

.mainTable th:nth-child(6),
.mainTable td:nth-child(6){
  width:27%;
}


/* =========================
   MAIN HEADER
========================= */

.mainTable th{
  background:#08dada;

  padding:8px 2px;

  text-align:center;

  font-size:12px;
  line-height:1.05;

  white-space:normal;

  overflow-wrap:anywhere;

  overflow:hidden;
}


/* =========================
   MAIN CELLS
========================= */

.mainTable td{
  border:1px solid #d9dfe2;

  height:43px;

  padding:1px;

  overflow:hidden;
}


/* =========================
   MAIN INPUTS
========================= */

.mainTable input{
  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  height:39px;

  border:0;
  outline:0;

  background:transparent;

  padding:3px 2px;

  font-size:15px;

  color:#172024;
}

.mainTable input.num{
  text-align:center;
}


/* =========================
   CALCULATED CELLS
========================= */

.mainTable .calc{
  text-align:center;

  padding:3px 1px;

  font-size:13px;

  font-variant-numeric:tabular-nums;

  background:#f8fafb;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:clip;
}


/* =========================
   SUMMARY
========================= */

.summary{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:6px;

  padding:7px;
}

.box{
  background:#08dada;

  border-radius:8px;

  padding:7px 9px;

  min-width:0;
}

.box span{
  font-size:12px;
}

.box strong{
  display:block;

  text-align:right;

  font-size:17px;

  margin-top:3px;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================
   AMOUNT SECTION
========================= */

.amount{
  width:100%;
  max-width:100%;

  padding:0 7px 7px;

  overflow:hidden;
}

.amount table{
  width:100%;
  max-width:100%;
  min-width:0;

  border-collapse:collapse;

  table-layout:fixed;
}

.amount th{
  background:#08dada;

  padding:8px 4px;

  text-align:left;

  font-size:12px;
}

.amount th:last-child{
  text-align:right;
}


/* NOTES = 35%
   AMOUNT = 65%
*/

.amount th:first-child,
.amount td:first-child{
  width:35%;
}

.amount th:last-child,
.amount td:last-child{
  width:65%;
}


/* =========================
   AMOUNT CELLS
========================= */

.amount td{
  height:40px;

  border:1px solid #d9dfe2;

  padding:2px 4px;
}


/* EDITABLE NOTES */

.amount .note{
  display:block;

  width:100%;
  max-width:100%;

  height:34px;

  border:0;
  outline:0;

  background:transparent;

  font-size:14px;

  padding:3px;

  color:#172024;
}


/* NUMERIC AMOUNT */

.amount .deduct{
  display:block;

  width:100%;
  max-width:100%;

  height:34px;

  text-align:right;

  border:0;
  outline:0;

  background:transparent;

  font-size:15px;

  padding:3px;
}

.amountTotal{
  font-weight:700;
}


/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;

  flex-wrap:nowrap;

  gap:4px;

  width:100%;
  max-width:100%;

  padding:7px;

  overflow:hidden;
}

.actions button{
  flex:1 1 0;

  width:20%;
  min-width:0;

  border:0;

  border-radius:9px;

  padding:10px 2px;

  font-size:11px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;
}

.add{
  background:#08dada;
}

.remove{
  background:#ffdede;
}

.saveBtn{
  background:#dffafa;
}

.png{
  background:#dffafa;
}

.clear{
  background:#e7eeee;
}


/* =========================
   IPHONE
========================= */

@media(max-width:600px){

  .app{
    padding:3px;
  }

  .top{
    margin-bottom:4px;
  }

  h1{
    font-size:18px;
  }

  .save{
    display:none;
  }


  /* CLIENT TABS */

  .clientTab{
    font-size:10px;
  }

  .clientName{
    font-size:10px;
    padding:8px 4px 8px 8px;
  }

  .deleteClient{
    font-size:17px;
    padding:5px 6px 5px 1px;
  }

  .newClient{
    font-size:10px;
    padding:8px 9px;
  }


  /* MAIN TABLE */

  .scroll{
    width:100%;
    max-width:100%;
    overflow:hidden;
  }

  .mainTable{
    width:100%;
    max-width:100%;
    min-width:0;

    table-layout:fixed;
  }


  /* HEADER */

  .mainTable th{
    font-size:9px;

    line-height:1.05;

    padding:7px 1px;

    white-space:normal;

    overflow-wrap:anywhere;
  }


  /* CELLS */

  .mainTable td{
    height:43px;

    padding:1px;
  }


  /* INPUT */

  .mainTable input{
    width:100%;
    max-width:100%;
    min-width:0;

    height:39px;

    padding:3px 1px;

    font-size:12px;
  }

  .mainTable input.num{
    text-align:center;
  }

  .mainTable .calc{
    font-size:11px;

    padding:3px 1px;
  }


  /* SUMMARY */

  .summary{
    grid-template-columns:1fr 1fr;

    gap:5px;

    padding:6px;
  }

  .box{
    padding:6px 7px;
  }

  .box span{
    font-size:10px;
  }

  .box strong{
    font-size:15px;
  }


  /* AMOUNT */

  .amount{
    padding:0 6px 6px;
  }

  .amount .note{
    font-size:13px;
  }

  .amount .deduct{
    font-size:14px;
  }


  /* BUTTONS */

  .actions{
    display:flex;

    flex-wrap:nowrap;

    gap:3px;

    padding:6px;

    overflow:hidden;
  }

  .actions button{
    flex:1 1 0;

    width:20%;

    min-width:0;

    padding:10px 1px;

    font-size:9px;

    border-radius:8px;
  }

}


/* =========================
   VERY SMALL IPHONE
========================= */

@media(max-width:390px){

  h1{
    font-size:17px;
  }

  .mainTable th{
    font-size:8px;
  }

  .mainTable input{
    font-size:11px;
  }

  .mainTable .calc{
    font-size:10px;
  }

  .amount .note{
    font-size:12px;
  }

  .amount .deduct{
    font-size:13px;
  }

  .actions{
    gap:2px;
  }

  .actions button{
    padding:9px 1px;
    font-size:8px;
  }

}

</style>

</head>


<body>

<div class="app">


  <!-- TOP -->

  <div class="top">

    <h1>T-Post</h1>

    <span
      class="save"
      id="saveState">
      Saved
    </span>

  </div>


  <!-- CLIENT TABS -->

  <div
    class="clientBar"
    id="clientBar">
  </div>


  <!-- MAIN CARD -->

  <div class="card">


    <!-- MAIN TABLE -->

    <div class="scroll">

      <table class="mainTable">

        <colgroup>

          <col style="width:25%">
          <col style="width:12%">
          <col style="width:9%">
          <col style="width:15%">
          <col style="width:12%">
          <col style="width:27%">

        </colgroup>


        <thead>

          <tr>

            <th>Name</th>

            <th>Qty</th>

            <th>kg/bag</th>

            <th>Kilo</th>

            <th>Price</th>

            <th>Total Amount</th>

          </tr>

        </thead>


        <tbody id="rows">
        </tbody>

      </table>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

      <div class="box">

        <span>
          Σ kilo
        </span>

        <strong id="sumKilo">
          0
        </strong>

      </div>


      <div class="box">

        <span>
          Σ Total Amount
        </span>

        <strong id="sumAmount">
          0
        </strong>

      </div>

    </div>


    <!-- AMOUNT -->

    <div class="amount">

      <table>

        <thead>

          <tr>

            <th>
              Notes
            </th>

            <th>
              Amount
            </th>

          </tr>

        </thead>


        <tbody id="deductions">
        </tbody>


        <tfoot>

          <tr>

            <td class="amountTotal">
              Amount total
            </td>

            <td
              class="calc amountTotal"
              id="amountTotal">
              0
            </td>

          </tr>

        </tfoot>

      </table>

    </div>


    <!-- BUTTONS -->

    <div class="actions">

      <button
        class="add"
        id="add">
        ＋ Add
      </button>


      <button
        class="remove"
        id="remove">
        − Remove
      </button>


      <button
        class="saveBtn"
        id="saveToday">
        💾 Save
      </button>


      <button
        class="png"
        id="savePNG">
        📷 PNG
      </button>


      <button
        class="clear"
        id="clear">
        Clear
      </button>

    </div>


  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const rowsEl =
  document.querySelector('#rows');

const dedEl =
  document.querySelector('#deductions');

const clientBar =
  document.querySelector('#clientBar');

const saveState =
  document.querySelector('#saveState');


/* =========================
   STORAGE
========================= */

const CLIENT_KEY =
  'TPOST_CLIENTS_V7';

const SNAPSHOT_KEY =
  'TPOST_SNAPSHOTS_V7';


let clients = {};

let currentClient = null;


/* =========================
   BLANK ROW
========================= */

function blank(){

  return {
    name:'',
    qty:'',
    kgBag:'',
    price:''
  };

}


/* =========================
   NUMBER
========================= */

function num(v){

  return Number.parseFloat(v) || 0;

}


/* =========================
   FORMAT
========================= */

function fmt(v){

  if(Number.isInteger(v)){
    return String(v);
  }

  return v
    .toFixed(2)
    .replace(/\.?0+$/,'');
}


/* =========================
   INPUT
========================= */

function makeInput(
  cls,
  value,
  type='text'
){

  const e =
    document.createElement('input');

  e.className =
    cls;

  e.value =
    value || '';

  e.type =
    type;

  if(type === 'number'){

    e.step =
      'any';

    e.inputMode =
      'decimal';

  }

  return e;

}


/* =========================
   ADD MAIN ROW
========================= */

function addRow(data=blank()){

  const tr =
    document.createElement('tr');


  const name =
    makeInput(
      '',
      data.name,
      'text'
    );


  const qty =
    makeInput(
      'num',
      data.qty,
      'number'
    );


  const kg =
    makeInput(
      'num',
      data.kgBag,
      'number'
    );


  const price =
    makeInput(
      'num',
      data.price,
      'number'
    );


  const kilo =
    document.createElement('td');

  kilo.className =
    'calc kilo';


  const total =
    document.createElement('td');

  total.className =
    'calc total';


  const cells = [
    name,
    qty,
    kg,
    kilo,
    price,
    total
  ];


  cells.forEach((x,i)=>{

    let td;


    if(i === 3 || i === 5){

      td = x;

    }else{

      td =
        document.createElement('td');

      td.appendChild(x);

    }


    tr.appendChild(td);

  });


  [
    name,
    qty,
    kg,
    price
  ].forEach(inputEl=>{

    inputEl.addEventListener(
      'input',
      ()=>{
        calculate();
        autoSave();
      }
    );

  });


  rowsEl.appendChild(tr);

}


/* =========================
   ADD NOTES / AMOUNT ROW
========================= */

function addDeduction(data={}){

  const tr =
    document.createElement('tr');


  /* NOTES */

  const noteCell =
    document.createElement('td');


  const note =
    makeInput(
      'note',
      data.note || '',
      'text'
    );


  noteCell.appendChild(note);


  /* AMOUNT */

  const amountCell =
    document.createElement('td');


  const amount =
    makeInput(
      'deduct',
      data.amount || '',
      'number'
    );


  amountCell.appendChild(amount);


  tr.appendChild(noteCell);

  tr.appendChild(amountCell);


  /* AUTO SAVE NOTES */

  note.addEventListener(
    'input',
    ()=>{
      autoSave();
    }
  );


  /* CALCULATE AMOUNT */

  amount.addEventListener(
    'input',
    ()=>{
      calculate();
      autoSave();
    }
  );


  dedEl.appendChild(tr);

}


/* =========================
   GET DATA
========================= */

function getData(){

  return {

    rows:
      [...rowsEl.rows]
      .map(r=>({

        name:
          r.cells[0]
          .firstChild.value,

        qty:
          r.cells[1]
          .firstChild.value,

        kgBag:
          r.cells[2]
          .firstChild.value,

        price:
          r.cells[4]
          .firstChild.value

      })),

    ded:
      [...dedEl.rows]
      .map(r=>({

        note:
          r.cells[0]
          .firstChild.value,

        amount:
          r.cells[1]
          .firstChild.value

      }))

  };

}


/* =========================
   AUTO SAVE
========================= */

function autoSave(){

  if(!currentClient){
    return;
  }


  clients[currentClient] =
    getData();


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  saveState.textContent =
    'Saved';

}


/* =========================
   LOAD CLIENTS
========================= */

function loadClients(){

  try{

    clients =
      JSON.parse(
        localStorage.getItem(
          CLIENT_KEY
        )
      ) || {};

  }catch(error){

    clients = {};

  }


  const names =
    Object.keys(clients);


  if(names.length === 0){

    currentClient =
      'Client 1';


    clients[currentClient] = {

      rows:[],
      ded:[]

    };

  }else{

    currentClient =
      names[0];

  }


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );

}


/* =========================
   RENDER CLIENT TABS
========================= */

function renderTabs(){

  clientBar.innerHTML = '';


  Object.keys(clients)
  .forEach(name=>{

    const tab =
      document.createElement('div');


    tab.className =
      'clientTab';


    if(name === currentClient){

      tab.classList.add(
        'active'
      );

    }


    /* CLIENT NAME BUTTON */

    const nameBtn =
      document.createElement('button');


    nameBtn.className =
      'clientName';


    nameBtn.textContent =
      name;


    nameBtn.onclick =
      ()=>{
        switchClient(name);
      };


    /* DELETE X BUTTON */

    const deleteBtn =
      document.createElement('button');


    deleteBtn.className =
      'deleteClient';


    deleteBtn.textContent =
      '×';


    deleteBtn.title =
      'Remove client';


    deleteBtn.onclick =
      (event)=>{

        event.stopPropagation();

        deleteClient(name);

      };


    tab.appendChild(
      nameBtn
    );


    tab.appendChild(
      deleteBtn
    );


    clientBar.appendChild(
      tab
    );

  });


  /* NEW CLIENT */

  const newButton =
    document.createElement('button');


  newButton.className =
    'newClient';


  newButton.textContent =
    '＋ New';


  newButton.onclick =
    createClient;


  clientBar.appendChild(
    newButton
  );

}


/* =========================
   LOAD CLIENT
========================= */

function loadClient(){

  rowsEl.innerHTML =
    '';

  dedEl.innerHTML =
    '';


  const data =
    clients[currentClient] || {

      rows:[],
      ded:[]

    };


  /* LOAD SAVED ROWS */

  (data.rows || [])
  .forEach(addRow);


  /* ALWAYS START WITH 10 ROWS */

  while(
    rowsEl.children.length < 10
  ){

    addRow();

  }


  /* LOAD NOTES AND AMOUNTS */

  (data.ded || [])
  .forEach(addDeduction);


  /* MINIMUM 13 AMOUNT ROWS */

  while(
    dedEl.children.length < 13
  ){

    addDeduction();

  }


  calculate();

}


/* =========================
   SWITCH CLIENT
========================= */

function switchClient(name){

  autoSave();

  currentClient =
    name;

  loadClient();

  renderTabs();

}


/* =========================
   CREATE NEW CLIENT
========================= */

function createClient(){

  const name =
    prompt(
      'Enter client name:'
    );


  if(name === null){
    return;
  }


  const cleanName =
    name.trim();


  if(!cleanName){

    alert(
      'Please enter a client name.'
    );

    return;

  }


  if(clients[cleanName]){

    alert(
      'That client already exists.'
    );

    return;

  }


  autoSave();


  clients[cleanName] = {

    rows:[],
    ded:[]

  };


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  currentClient =
    cleanName;


  loadClient();

  renderTabs();


  saveState.textContent =
    'Saved';

}


/* =========================
   DELETE CLIENT
========================= */

function deleteClient(name){

  if(
    !confirm(
      'Remove "' +
      name +
      '" and all of its saved data?'
    )
  ){

    return;

  }


  delete clients[name];


  const names =
    Object.keys(clients);


  /* ALWAYS KEEP ONE CLIENT */

  if(names.length === 0){

    currentClient =
      'Client 1';


    clients[currentClient] = {

      rows:[],
      ded:[]

    };

  }else if(
    currentClient === name
  ){

    currentClient =
      names[0];

  }


  localStorage.setItem(
    CLIENT_KEY,
    JSON.stringify(clients)
  );


  loadClient();

  renderTabs();


  saveState.textContent =
    'Saved';

}


/* =========================
   CALCULATE
========================= */

function calculate(){

  let totalKilo = 0;

  let totalAmount = 0;


  [...rowsEl.rows]
  .forEach(row=>{

    const qty =
      num(
        row.cells[1]
        .firstChild.value
      );


    const kgBag =
      num(
        row.cells[2]
        .firstChild.value
      );


    const price =
      num(
        row.cells[4]
        .firstChild.value
      );


    const kilo =
      qty * kgBag;


    const amount =
      kilo * price;


    row.querySelector(
      '.kilo'
    ).textContent =
      fmt(kilo);


    row.querySelector(
      '.total'
    ).textContent =
      fmt(amount);


    totalKilo +=
      kilo;


    totalAmount +=
      amount;

  });


  /* DEDUCTIONS */

  let deductions = 0;


  document
  .querySelectorAll('.deduct')
  .forEach(inputEl=>{

    deductions +=
      num(inputEl.value);

  });


  /* TOTALS */

  document.querySelector(
    '#sumKilo'
  ).textContent =
    fmt(totalKilo);


  document.querySelector(
    '#sumAmount'
  ).textContent =
    fmt(totalAmount);


  document.querySelector(
    '#amountTotal'
  ).textContent =
    fmt(
      totalAmount -
      deductions
    );

}


/* =========================
   ADD ROW BUTTON
========================= */

document
.querySelector('#add')
.onclick = ()=>{

  addRow();

  calculate();

  autoSave();

};


/* =========================
   REMOVE ROW BUTTON
========================= */

document
.querySelector('#remove')
.onclick = ()=>{

  const rows =
    rowsEl.querySelectorAll('tr');


  if(rows.length <= 1){

    alert(
      'At least one row must remain.'
    );

    return;

  }


  rowsEl
  .lastElementChild
  .remove();


  calculate();

  autoSave();

};


/* =========================
   SAVE BUTTON
========================= */

document
.querySelector('#saveToday')
.onclick = ()=>{

  const name =
    prompt(
      'Enter a name for this saved calculation:'
    );


  if(name === null){
    return;
  }


  const cleanName =
    name.trim();


  if(!cleanName){

    alert(
      'Please enter a name.'
    );

    return;

  }


  let snapshots = {};


  try{

    snapshots =
      JSON.parse(
        localStorage.getItem(
          SNAPSHOT_KEY
        )
      ) || {};

  }catch(error){

    snapshots = {};

  }


  snapshots[cleanName] =
    getData();


  localStorage.setItem(
    SNAPSHOT_KEY,
    JSON.stringify(
      snapshots
    )
  );


  autoSave();


  saveState.textContent =
    'Saved: ' + cleanName;


  alert(
    'Saved as "' +
    cleanName +
    '"'
  );

};


/* =========================
   PNG BUTTON
========================= */

document
.querySelector('#savePNG')
.onclick = ()=>{

  alert(
    'PNG saving will be added separately.'
  );

};


/* =========================
   CLEAR BUTTON
========================= */

document
.querySelector('#clear')
.onclick = ()=>{

  if(
    !confirm(
      'Clear all entries for "' +
      currentClient +
      '"?'
    )
  ){

    return;

  }


  rowsEl.innerHTML =
    '';

  dedEl.innerHTML =
    '';


  /* RESET TO 10 ROWS */

  for(
    let i=0;
    i<10;
    i++
  ){

    addRow();

  }


  /* RESET NOTES / AMOUNTS */

  for(
    let i=0;
    i<13;
    i++
  ){

    addDeduction();

  }


  calculate();

  autoSave();

};


/* =========================
   START APP
========================= */

loadClients();

renderTabs();

loadClient();

calculate();

========================= */

){

  window.addEventListener(
    'load',
    ()=>{
      navigator.serviceWorker
      .register('sw.js')
      .catch(()=>{});
    }
  );

}
